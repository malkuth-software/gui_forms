# CorrespondenceView's property value rules, stated once (IC3: the property families' requires, moved out of
# the prose of tools/property_families/correspondence_view.json into clauses; the format is template_harness
# docs/ic_declarations.md). tools/ic_declarations.py generates the header's // ic: lines and the entry checks
# (lab/src/correspondence_view_ic_checks.hpp) that prepare_write calls. A refusal failure:invalid_argument is a throw of
# std::invalid_argument before anything changes. Rules the clause grammar cannot state (UTF-8 text, font
# specifications, enumerations) stay in prepare_write and the family's prose.

schema = 1
component = "CorrespondenceView"
namespace = "gui_forms"
header = "lab/include/gui_forms_lab/correspondence_view.hpp"
anchor = "class CorrespondenceView final : public Panel, public CorrespondenceViewCapabilities<CorrespondenceView> {"
thread = "ui"

[checks]
path = "lab/src/correspondence_view_ic_checks.hpp"
namespace = "gui_forms::detail::ic::correspondence_view"
includes = ["gui_forms_lab/correspondence_view.hpp"]
used_in = ["lab/src/correspondence_view.cpp"]

[[call]]
name = "status_rail_width"
id = "status_rail_width_write"
declarations = ["void prepare_write(const decltype(status_rail_width)&"]
kind = "member"
parameters = { incoming = "double" }
requires = [
  { holds = "finite(incoming) and incoming >= 1 and incoming <= 12", refuses = "failure:invalid_argument", check = "status_rail_width" },
]
