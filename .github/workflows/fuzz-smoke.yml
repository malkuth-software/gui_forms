name: Codec fuzz smoke
# A few minutes of libFuzzer per target per change, on GitHub's runners only:
# a cheap build check that surfaces broken contracts quickly. It is not a
# certificate and never runs on the owner's machine (owner revision of
# decision 6A, 2026-10-20). The deterministic malformed-input sweeps in the
# normal suite and the sanitized local run at checkpoint fold time carry the evidence.
on:
  # Weekly backstop and manual runs only (owner, 2026-10-29): the owned codecs passed their
  # differential and fuzz gates long ago, and the normal suite (on every change) and the
  # sanitized local run at checkpoint fold time carry the deterministic malformed-input sweeps.
  schedule:
    - cron: '37 4 * * 6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fuzz-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    name: ${{ matrix.target }} / ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
        target: [inflate, inflate_oracle_ordinary, inflate_oracle_strict, inflate_protocol, deflate, png_decode, conv, rtf2md_markdown, rtf2md_rtf]
        include:
          - architecture: x64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    env:
      SMOKE_SECONDS: 150
    steps:
      - uses: actions/checkout@v4
      # The codecs' sources come from malkuth-software/stx at the commit stx.lock pins.
      - name: Check out the pinned stx
        run: |
          commit=$(sed -n 's/^commit = "\([0-9a-f]\{40\}\)"$/\1/p' stx.lock)
          test -n "$commit"
          git init -q stx
          git -C stx remote add origin https://github.com/malkuth-software/stx.git
          git -C stx fetch -q --depth 1 origin "$commit"
          git -C stx checkout -q --detach FETCH_HEAD
      - name: Install the pinned compiler series
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm-key.asc"
          sudo install -m 0644 "$RUNNER_TEMP/llvm-key.asc" /usr/share/keyrings/apt-llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/apt-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y clang-22 libclang-rt-22-dev
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - name: Fetch and verify the pinned zlib oracle
        if: startsWith(matrix.target, 'inflate_oracle')
        run: |
          git init oracle
          git -C oracle remote add origin https://github.com/madler/zlib.git
          git -C oracle fetch --depth 1 origin 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
          git -C oracle checkout --detach FETCH_HEAD
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          manifest = json.loads(pathlib.Path('stx/stx_zlib/tests/oracle_sha256.json').read_text())
          for name, expected in manifest['files'].items():
              actual = hashlib.sha256((pathlib.Path('oracle') / name).read_bytes()).hexdigest()
              if actual != expected:
                  sys.exit('oracle hash mismatch: ' + name)
          PY
      - name: Build the target
        run: |
          set -eu
          flags="-std=c++20 -O1 -g -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -Iinclude -Istx/stx_zlib/include"
          case "${{ matrix.target }}" in
            inflate) clang++ $flags stx/stx_zlib/fuzz/inflate_fuzz.cpp stx/stx_zlib/src/inflate.cpp stx/stx_zlib/src/checksum.cpp -o smoke ;;
            inflate_oracle_*)
              mode=""
              if [ "${{ matrix.target }}" = inflate_oracle_strict ]; then mode=-DINFLATE_STRICT; fi
              objects=""
              for name in adler32 crc32 deflate inflate inffast inftrees trees zutil; do
                clang -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer $mode -Ioracle -c oracle/$name.c -o $name.o
                objects="$objects $name.o"
              done
              clang++ $flags -Ioracle -DSTX_ZLIB_INFLATE_ORACLE=1 stx/stx_zlib/fuzz/inflate_fuzz.cpp stx/stx_zlib/src/inflate.cpp stx/stx_zlib/src/checksum.cpp $objects -o smoke ;;
            inflate_protocol) clang++ $flags fuzz/inflate_protocol_fuzz.cpp stx/stx_zlib/src/inflate.cpp stx/stx_zlib/src/checksum.cpp -o smoke ;;
            deflate) clang++ $flags fuzz/deflate_fuzz.cpp stx/stx_zlib/src/inflate.cpp stx/stx_zlib/src/checksum.cpp stx/stx_zlib/src/deflate.cpp -o smoke ;;
            rtf2md_markdown) clang++ $flags -Istx/stx_rtf2md/include -Istx/stx_rtf2md/src stx/stx_rtf2md/fuzz/markdown_round_trip_fuzz.cpp \
                   stx/stx_rtf2md/src/document.cpp stx/stx_rtf2md/src/limits.cpp stx/stx_rtf2md/src/text_scan.cpp \
                   stx/stx_rtf2md/src/markdown_inline.cpp stx/stx_rtf2md/src/markdown_reader.cpp stx/stx_rtf2md/src/markdown_writer.cpp \
                   stx/stx_rtf2md/src/rtf_reader.cpp stx/stx_rtf2md/src/rtf_writer.cpp -o smoke ;;
            rtf2md_rtf) clang++ $flags -Istx/stx_rtf2md/include -Istx/stx_rtf2md/src stx/stx_rtf2md/fuzz/rtf_read_fuzz.cpp \
                   stx/stx_rtf2md/src/document.cpp stx/stx_rtf2md/src/limits.cpp stx/stx_rtf2md/src/text_scan.cpp \
                   stx/stx_rtf2md/src/markdown_inline.cpp stx/stx_rtf2md/src/markdown_reader.cpp stx/stx_rtf2md/src/markdown_writer.cpp \
                   stx/stx_rtf2md/src/rtf_reader.cpp stx/stx_rtf2md/src/rtf_writer.cpp -o smoke ;;
            conv) clang++ $flags -Istx/stx_conv/include stx/stx_conv/fuzz/conv_fuzz.cpp stx/stx_conv/src/plan.cpp stx/stx_conv/src/profile.cpp stx/stx_conv/src/image.cpp -o smoke ;;
            png_decode) clang++ $flags -Istx/stx_png/include stx/stx_png/fuzz/png_decode_fuzz.cpp stx/stx_png/src/decoder.cpp stx/stx_png/src/encoder.cpp stx/stx_zlib/src/inflate.cpp stx/stx_zlib/src/checksum.cpp stx/stx_zlib/src/deflate.cpp -o smoke ;;
          esac
      - name: Run the smoke
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -eu
          mkdir -p corpus failures
          case "${{ matrix.target }}" in
            inflate*) cp stx/stx_zlib/fuzz/corpus/inflate/* corpus/ ;;
            rtf2md_rtf) cp stx/stx_rtf2md/tests/corpus/*.rtf corpus/ ;;
          esac
          seed=20261020
          if [ "${{ matrix.architecture }}" = arm64 ]; then seed=20261021; fi
          ./smoke -seed=$seed -max_total_time=$SMOKE_SECONDS -max_len=65536 -timeout=20 \
            -rss_limit_mb=2048 -artifact_prefix=failures/ -print_final_stats=1 corpus
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-smoke-failures-${{ matrix.target }}-${{ matrix.architecture }}
          path: failures
          if-no-files-found: ignore
          retention-days: 14
