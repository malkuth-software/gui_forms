name: GUI.Forms native platform
# One platform's native job: build, install, smoke check, test cache, object
# cache and evidence (the tests run in malkuth-software/gui_forms_tests). native.yml calls it
# once per platform, so each platform's programs job (release.yml) can start as
# soon as its own native job passes instead of waiting for all four. Every
# github.* value (event, ref, sha, run) is the calling run's.
on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      platform:
        type: string
        required: true
      shell:
        type: string
        required: true
      force_validation:
        description: Run native validation even if an identical successful receipt exists
        type: boolean
        default: false
      cold_build:
        description: Restore no compiler cache or object seed (measures a cold build)
        type: boolean
        default: false
      package_windows_toolchain:
        description: Install and package a new Windows toolchain when none is published for the harness's windows_toolchain.json
        type: boolean
        default: false
      docs_only:
        description: A documentation-only pull request (tools/ci_docs_only.py) builds nothing
        type: boolean
        default: false
      windows_test_pch:
        description: Windows only, a diagnostic run that compiles the tests with the shared precompiled headers again (they are off on Windows), to catch a silent build with the resource sampler
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  # tools/ci_reuse.py finds a producer's job by this name: the calling job is
  # named "native (<runner>, <platform>, <shell>)", so the job reads
  # "native (<runner>, <platform>, <shell>) / build".
  # A documentation-only pull request skips this job, which then reports
  # success under its usual check name without building (native.yml, changes).
  build:
    if: ${{ !inputs.docs_only }}
    runs-on: ${{ inputs.runner }}
    # A cold Windows build that also packages a new toolchain needs headroom.
    # A change to the compile flags makes every platform cold at once: the
    # macOS build then took 30 min plus 8.5 min of text-mask tests (2026-11-02).
    # Windows: 120 while its object cache refills (4858cb741 built 761 of 1962
    # steps in 60 minutes from an older cache key); the other hosts keep 60.
    timeout-minutes: ${{ inputs.platform == 'windows-x64' && 120 || 60 }}
    permissions:
      contents: write
      actions: read
    env:
      GUI_FORMS_RUNNER: ${{ inputs.runner }}
      OBJCXX: clang++
      CC: clang
      CXX: clang++
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_OBJCXX_COMPILER_LAUNCHER: ccache
    defaults:
      run:
        shell: ${{ inputs.shell }}
    steps:
      # One tree per job: a pull_request run takes its workflow files from the
      # test merge commit (refs/pull/N/merge), so the job checks out that same
      # commit (the default ref), never the head alone, whose older tree may
      # lack tools main's workflow calls. A push or a merge group checks out
      # its own commit. A merge group's branch is temporary: it never promotes
      # (main only) and saves no Actions cache, and it reuses a pull request's
      # validation of the same tree (tools/ci_reuse.py), as main then reuses
      # the merge group's.
      - uses: actions/checkout@v4
        with:
          path: gui_forms
          # A pull request's merge commit and its base (HEAD^1), for the change selection.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      # template_harness beside gui_forms, at the commit gui_forms/harness.lock
      # pins: the reuse, promotion, cache and toolchain tools
      # (docs/building/template-harness.md).
      - uses: ./gui_forms/.github/actions/harness-checkout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find exact-tree validated archive before installing build tools
        id: promotion
        if: github.ref == 'refs/heads/main' && inputs.force_validation != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python template_harness/harness/ci_promote.py lookup --platform "${{ inputs.platform }}"
      - uses: actions/download-artifact@v4
        if: steps.promotion.outputs.reused == 'true'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.promotion.outputs.producer-run }}
          artifact-ids: ${{ steps.promotion.outputs.artifact-id }}
          path: .ci/download
          merge-multiple: true
      - name: Promote validated bytes and preserve their producer identity
        if: steps.promotion.outputs.reused == 'true'
        shell: bash
        run: python template_harness/harness/ci_promote.py archive
      # Stdlib zstd packs and extracts the Windows toolchain; the build keeps its Python.
      - uses: actions/setup-python@v5
        id: toolchain-python
        if: runner.os == 'Windows'
        with:
          python-version: '3.14'
          update-environment: false
      - name: Fetch the Windows toolchain recorded by the promoted cache
        if: steps.promotion.outputs.reused == 'true' && runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN_PYTHON: ${{ steps.toolchain-python.outputs.python-path }}
        run: '"$TOOLCHAIN_PYTHON" template_harness/harness/windows_toolchain.py fetch-recorded'
      - name: Restore the published Windows toolchain without MSYS2 mirrors
        id: toolchain
        if: steps.promotion.outputs.reused != 'true' && runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN_PYTHON: ${{ steps.toolchain-python.outputs.python-path }}
          GUI_FORMS_PACKAGE_WINDOWS_TOOLCHAIN: ${{ inputs.package_windows_toolchain }}
        run: '"$TOOLCHAIN_PYTHON" template_harness/harness/windows_toolchain.py restore'
      - name: Install macOS dependencies
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'macOS')
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install cmake ninja ccache llvm@22
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"
      # The Ubuntu mirror is sometimes slow (7-11 minutes for 30 MB), so the
      # downloaded Ubuntu packages are kept in an Actions cache, refreshed once
      # per runner image; only main saves it (harness/install_linux_ci_packages.sh).
      - name: Name the Linux package cache
        id: linux-image
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'Linux')
        run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: linux-packages
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'Linux')
        with:
          path: ${{ runner.temp }}/apt-archives
          key: linux-debs-v1-toolkit-${{ runner.arch }}-${{ hashFiles('template_harness/harness/install_linux_ci_packages.sh', 'template_harness/projects/gui_forms.toml') }}-${{ steps.linux-image.outputs.image }}
          restore-keys: linux-debs-v1-toolkit-${{ runner.arch }}-${{ hashFiles('template_harness/harness/install_linux_ci_packages.sh', 'template_harness/projects/gui_forms.toml') }}-
      # The toolkit profile and clang 22, the bootstrap compiler of the
      # harness's static Linux runtime (cmake/llvm22.cmake).
      - name: Install Linux dependencies
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'Linux')
        run: sh gui_forms/tools/install_linux_ci_packages.sh toolkit "$RUNNER_TEMP/apt-archives"
      - uses: actions/cache/save@v4
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'Linux') && github.event_name != 'pull_request' && github.event_name != 'merge_group' && steps.linux-packages.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.linux-packages.outputs.cache-primary-key }}
      # The MSYS2 mirrors carry only the current LLVM, so they are reached
      # only when a run dispatched with package_windows_toolchain finds no
      # published toolchain for the harness's windows_toolchain.json (a deliberate
      # specification change). Otherwise the restore step above fails with
      # ToolchainUnavailable, and packing refuses an LLVM the spec does not pin.
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: steps.promotion.outputs.reused != 'true' && runner.os == 'Windows' && steps.toolchain.outputs.restored != 'true'
        with:
          msystem: CLANG64
          update: true
          path-type: inherit
          install: ${{ steps.toolchain.outputs.packages }}
      - name: Package the newly installed Windows toolchain before building
        id: toolchain-package
        if: steps.msys2.outcome == 'success'
        shell: bash
        env:
          TOOLCHAIN_PYTHON: ${{ steps.toolchain-python.outputs.python-path }}
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: '"$TOOLCHAIN_PYTHON" template_harness/harness/windows_toolchain.py pack --root "$MSYS2_LOCATION"'
      - uses: actions/upload-artifact@v4
        if: steps.toolchain-package.outcome == 'success'
        with:
          name: ${{ steps.toolchain-package.outputs.artifact-name }}
          overwrite: true
          path: |
            gui-forms-toolchain-windows-x64.tar.zst
            gui-forms-toolchain-windows-x64.json
          compression-level: 0
          retention-days: 30
      - name: Select macOS 14 runtime prefix
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'macOS')
        run: echo "GUI_FORMS_LLVM_RUNTIME=$PWD/.build/toolchain/llvm-22.1.8-macos14" >> "$GITHUB_ENV"
      - name: Identify and verify LLVM release compiler
        if: steps.promotion.outputs.reused != 'true'
        id: compiler
        run: python template_harness/harness/compiler_identity.py
      # Linux links the harness's static position-independent C++ runtime
      # (template_harness build_linux_runtimes.py), the same on every
      # distribution; the packages above are only the bootstrap compiler.
      # Restored before the reuse lookup, because a reused cache is verified
      # against it.
      - name: Select the Linux runtime prefix
        id: linux-runtime
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'Linux')
        run: |
          directory="$(python template_harness/harness/linux_runtime_manifest.py --directory-name)"
          echo "GUI_FORMS_LLVM_RUNTIME=$PWD/.build/toolchain/$directory" >> "$GITHUB_ENV"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'Linux')
        with:
          path: .build/toolchain/${{ steps.linux-runtime.outputs.directory }}
          key: gui-linux-runtimes-v1-${{ steps.linux-runtime.outputs.directory }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('template_harness/harness/build_linux_runtimes.py', 'template_harness/harness/linux_runtime_manifest.py', 'template_harness/harness/macos_runtime_manifest.py') }}
      - name: Build the static Linux runtimes
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'Linux')
        run: |
          if [ ! -f "$GUI_FORMS_LLVM_RUNTIME/runtime-manifest.json" ]; then
            python template_harness/harness/build_linux_runtimes.py --work "$RUNNER_TEMP/llvm-runtimes" --prefix "$GUI_FORMS_LLVM_RUNTIME" --jobs 4
          fi
          python template_harness/harness/linux_runtime_manifest.py "$GUI_FORMS_LLVM_RUNTIME"
      - name: Fingerprint all tracked inputs and build environment
        if: steps.promotion.outputs.reused != 'true'
        id: inputs
        run: |
          python -B -m unittest discover -s template_harness/harness -p test_ci_reuse.py
          python template_harness/harness/ci_reuse.py identity --platform "${{ inputs.platform }}" --compiler "${{ steps.compiler.outputs.identity }}" --environment "${{ steps.compiler.outputs.environment }}"
      - uses: actions/upload-artifact@v4
        if: steps.promotion.outputs.reused != 'true'
        with:
          name: ${{ steps.inputs.outputs.inputs-name }}
          path: .ci/inputs.json
          include-hidden-files: true
          overwrite: true
          retention-days: 30
      - name: Reuse identical successful native validation
        id: reuse
        if: steps.promotion.outputs.reused != 'true' && (inputs.force_validation != true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python template_harness/harness/ci_reuse.py lookup
      - uses: actions/download-artifact@v4
        if: steps.promotion.outputs.reused != 'true' && (steps.reuse.outputs.reused == 'true')
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.reuse.outputs.producer-run }}
          artifact-ids: ${{ steps.reuse.outputs.artifact-id }}
          path: .ci/download
          merge-multiple: true
      - name: Verify and restore the validated cache payload
        if: steps.promotion.outputs.reused != 'true' && (steps.reuse.outputs.reused == 'true')
        run: python template_harness/harness/ci_reuse.py restore
      - name: Retain reused macOS runtimes in this branch cache
        uses: actions/cache/save@v4
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'macOS' && steps.reuse.outputs.reused == 'true')
        with:
          path: .build/toolchain/llvm-22.1.8-macos14
          key: gui-runtimes-v1-${{ inputs.platform }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('template_harness/harness/build_macos_runtimes.py', 'template_harness/harness/macos_runtime_manifest.py') }}
      - uses: actions/cache@v4
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'macOS' && steps.reuse.outputs.reused != 'true')
        with:
          path: .build/toolchain/llvm-22.1.8-macos14
          key: gui-runtimes-v1-${{ inputs.platform }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('template_harness/harness/build_macos_runtimes.py', 'template_harness/harness/macos_runtime_manifest.py') }}
      - name: Build minimum-compatible macOS runtimes
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'macOS' && steps.reuse.outputs.reused != 'true')
        run: |
          if [ ! -f "$GUI_FORMS_LLVM_RUNTIME/runtime-manifest.json" ]; then
            python template_harness/harness/build_macos_runtimes.py --work "$RUNNER_TEMP/llvm-runtimes" --prefix "$GUI_FORMS_LLVM_RUNTIME" --jobs 4
          fi
          python template_harness/harness/macos_runtime_manifest.py "$GUI_FORMS_LLVM_RUNTIME"
          python template_harness/harness/audit_macos_minimum.py "$GUI_FORMS_LLVM_RUNTIME/lib"
      - name: Configure compiler cache
        if: steps.promotion.outputs.reused != 'true'
        run: |
          cache_dir="$PWD/.ccache"
          cache_base="$PWD"
          if command -v cygpath >/dev/null; then
            cache_dir="$(cygpath -m "$cache_dir")"
            cache_base="$(cygpath -m "$cache_base")"
          fi
          echo "CCACHE_DIR=$cache_dir" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$cache_base" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          # The test programs share precompiled headers
          # (cmake/TestPrecompiledHeader.cmake): ccache caches a compile that
          # reads one only with these two relaxations.
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros" >> "$GITHUB_ENV"
          # One full tree's objects are 0.9 to 1.2 GB; a smaller limit evicts
          # during the build (the check efficiency audit, 2b). The saved cache is
          # still only this build's working set (ci_cache.py evict).
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          # Before the cache is restored: tools/ci_cache.py evict keeps the
          # entries used after this moment.
          echo "GUI_FORMS_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      # A cold build (dispatch input cold_build) restores no objects and no seed.
      # A pull request restores its own last objects first (saved below, family
      # ...-pr<number>-), then main's.
      - uses: actions/cache/restore@v4
        id: objects
        if: steps.promotion.outputs.reused != 'true' && (steps.reuse.outputs.reused != 'true') && inputs.cold_build != true
        with:
          path: .ccache
          key: gui-objects-v2-${{ inputs.platform }}-${{ steps.compiler.outputs.identity }}-${{ steps.inputs.outputs.tree }}
          restore-keys: |
            gui-objects-v2-${{ inputs.platform }}-${{ steps.compiler.outputs.identity }}-pr${{ github.event.pull_request.number }}-
            gui-objects-v2-${{ inputs.platform }}-${{ steps.compiler.outputs.identity }}-
            gui-objects-v2-${{ inputs.platform }}-
      - uses: actions/cache/restore@v4
        id: dependencies
        if: steps.promotion.outputs.reused != 'true' && (steps.reuse.outputs.reused != 'true')
        with:
          path: |
            gui_forms/third_party/miniaudio
          key: gui-deps-v5-${{ runner.os }}-${{ hashFiles('gui_forms/cmake/Audio.cmake') }}
      - name: Find recent validated object seed across branches
        id: seed
        if: steps.promotion.outputs.reused != 'true' && steps.reuse.outputs.reused != 'true' && inputs.cold_build != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python template_harness/harness/ci_promote.py seed --platform "${{ inputs.platform }}"
      - uses: actions/download-artifact@v4
        if: steps.seed.outputs.seeded == 'true'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.seed.outputs.producer-run }}
          artifact-ids: ${{ steps.seed.outputs.artifact-id }}
          path: .ci/download
          merge-multiple: true
      - name: Restore content-checked objects without reusing test results
        if: steps.seed.outputs.seeded == 'true'
        run: python template_harness/harness/ci_promote.py restore-seed
      # The stx package (cmake/Stx.cmake, cmake/stx_package/): stx_skia, the
      # stx libraries and STXlib (no third-party sources since 2026-11-16),
      # built once per stx commit, recipe,
      # platform and compiler and otherwise only linked. The key holds what the
      # package's stamp holds; when a restored package's stamp still differs,
      # configuring rebuilds it and tools/ci_build.py warns that the key misses
      # an input. A cold build restores none.
      - uses: actions/cache/restore@v4
        id: stx-package
        if: steps.promotion.outputs.reused != 'true' && steps.reuse.outputs.reused != 'true' && inputs.cold_build != true
        with:
          path: .ci/stx-package
          key: gui-stx-package-v1-${{ inputs.platform }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('gui_forms/stx.lock', 'gui_forms/cmake/Stx.cmake', 'gui_forms/cmake/stx_package/**', 'gui_forms/cmake/llvm22.cmake', 'gui_forms/tools/toolkit_configure.py') }}
      # The library, its install and smoke check, and the test cache
      # malkuth-software/gui_forms_tests builds against (tools/ci_build.py
      # --test-cache; tools/test_cache.py). The tests run there, not here.
      - name: Build native toolkit and pack the test cache
        id: build
        if: steps.promotion.outputs.reused != 'true' && (steps.reuse.outputs.reused != 'true')
        env:
          GUI_FORMS_STX_PACKAGE_DIR: ${{ github.workspace }}/.ci/stx-package
          GUI_FORMS_STX_PACKAGE_RESTORED: ${{ steps.stx-package.outputs.cache-hit }}
        # Windows: tools/windows_resource_sampler.ps1 samples memory, paging
        # and the busiest processes every 30 s in the background while this
        # step runs, into .ci/windows-resources.tsv (evidence; the phases step
        # lines it up with the build's quiet stretches). It only observes.
        # The EXIT trap stops it whatever the step's result: the stop file
        # ends it within about a second, the kill catches one that has not
        # gone, and the trap leaves the step's exit status as the build's.
        run: |
          ccache --zero-stats
          if [ "$RUNNER_OS" = Windows ]; then
            sampler_stop=.ci/windows-resources.stop
            rm -f "$sampler_stop"
            "$(cygpath -u "$SYSTEMROOT")/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass \
              -File gui_forms/tools/windows_resource_sampler.ps1 \
              -Log .ci/windows-resources.tsv -Stop "$sampler_stop" -IntervalSeconds 30 &
            sampler_pid=$!
            trap 'touch "$sampler_stop"; sleep 2; kill "$sampler_pid" 2>/dev/null || true; wait "$sampler_pid" 2>/dev/null || true' EXIT
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" python gui_forms/tools/ci_build.py --jobs 4 --test-cache .ci/test-cache
          else
            python gui_forms/tools/ci_build.py --jobs 4 --test-cache .ci/test-cache
          fi
      # Where the build's time went (tools/ninja_phases.py): evidence in the
      # job log and on the run's summary page, never a gate. Its slowest
      # edges and quiet stretches name what a silent build was running; the
      # evidence artifact keeps the .ninja_log itself.
      - name: Report the build's phases
        if: always() && steps.promotion.outputs.reused != 'true' && steps.reuse.outputs.reused != 'true'
        run: python gui_forms/tools/ninja_phases.py .build/native-${{ inputs.platform }}/gui-forms --title "native-${{ inputs.platform }} build" --out "$GITHUB_STEP_SUMMARY" ${{ inputs.platform == 'windows-x64' && '--samples .ci/windows-resources.tsv' || '' }}
      # SK2: the time each host spends presenting a frame
      # (benchmarks/present_profile_workload.cpp), in the configuration the
      # toolkit step built. Its values are evidence, never a gate; a workload
      # that cannot run fails the job, because a broken measurement is a defect.
      - name: Measure present time per frame
        if: steps.promotion.outputs.reused != 'true' && (steps.reuse.outputs.reused != 'true')
        run: |
          build=.build/native-${{ inputs.platform }}/gui-forms
          result=.ci/present-${{ inputs.platform }}.json
          cmake --build "$build" --target gui_forms_present_profile_workload --parallel 4
          mkdir -p .ci
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" "$build/gui_forms_present_profile_workload" "$result"
          else
            "$build/gui_forms_present_profile_workload" "$result"
          fi
          cat "$result" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.promotion.outputs.reused != 'true' && (steps.reuse.outputs.reused != 'true')
        with:
          name: present-${{ inputs.platform }}
          path: .ci/present-${{ inputs.platform }}.json
          include-hidden-files: true
          overwrite: true
          retention-days: 90
      - name: Prove one compression and PNG implementation in the link map
        if: steps.promotion.outputs.reused != 'true' && (steps.reuse.outputs.reused != 'true')
        run: |
          # Every static archive the toolkit links, the stx package's (stx_skia,
          # the stx libraries, STXlib) among them: no C zlib, FreeType gzip or libpng
          # may remain (Z-stage I5, decision 3A).
          build=.build/native-${{ inputs.platform }}
          archives=$(find "$build/gui-forms" .ci/stx-package -name '*.a' -not -path '*/_deps/*' -not -name '*.dll.a')
          python gui_forms/tools/audit_link_map.py --forbid-foreign $archives
      # A pull request installs no SDK (above); the merge group audits it.
      - name: Audit installed macOS binary minimums
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'macOS' && steps.reuse.outputs.reused != 'true') && github.event_name != 'pull_request'
        # The localizable-literal plugin runs inside the compiler that loads
        # it, so it links that compiler's C++ runtime (Homebrew clang's system
        # libc++), not a bundled one; the audit checks it against the compiler.
        run: |
          python template_harness/harness/audit_macos_minimum.py             --compiler "$(command -v clang++)" --compiler-plugin gui_forms_localizable.so             .build/native-macos-arm64/gui-forms-sdk .build/native-macos-arm64/installed-reference-examples
      # Only main saves dependencies: a pull request's copy could be restored
      # by no other ref and held 0.5 GB of the 10 GB. Only after every build
      # and test step above passed (owner, 2026-11-01): a failed run's
      # partial fetch must never become the entry the next run restores.
      # The sources are platform-neutral, so the entry is keyed by the runner's
      # OS only (Linux x64 and arm64 share one; Windows stays apart, as the
      # Actions cache restores no entry across Windows and the others). The
      # miniaudio Git checkout FetchContent made is kept at third_party/miniaudio,
      # the place cmake/Audio.cmake (and the source SDK) read it from.
      - name: Keep the fetched miniaudio sources with the other dependencies
        if: steps.promotion.outputs.reused != 'true' && (success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.reuse.outputs.reused != 'true' && steps.dependencies.outputs.cache-primary-key != '' && steps.dependencies.outputs.cache-hit != 'true')
        run: |
          fetched=".build/native-${{ inputs.platform }}/gui-forms/_deps/gui_forms_miniaudio-src"
          if [ ! -f gui_forms/third_party/miniaudio/miniaudio.h ] && [ -f "$fetched/miniaudio.h" ]; then
            mkdir -p gui_forms/third_party/miniaudio
            tar -C "$fetched" -cf - . | tar -C gui_forms/third_party/miniaudio -xf -
          fi
      - uses: actions/cache/save@v4
        if: steps.promotion.outputs.reused != 'true' && (success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.reuse.outputs.reused != 'true' && steps.dependencies.outputs.cache-primary-key != '' && steps.dependencies.outputs.cache-hit != 'true')
        with:
          path: |
            gui_forms/third_party/miniaudio
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      # A package this job built is kept for the runs after it whenever its
      # stamp exists, whatever the build and tests did after it (owner,
      # 2026-11-16: the check efficiency audit's fix 5; before, only after
      # every step passed). cmake/Stx.cmake writes the stamp only after the
      # package built and installed completely, and the package depends only
      # on what its key holds, never on the tests. Pull requests save it too:
      # the key changes only when stx.lock or the recipe does, so the entries
      # are rare, and the pull request's later runs then link it instead of
      # building it again (about 106 s per job). Merge groups save nothing.
      - uses: actions/cache/save@v4
        if: always() && steps.promotion.outputs.reused != 'true' && steps.reuse.outputs.reused != 'true' && inputs.cold_build != true && github.event_name != 'merge_group' && steps.stx-package.outputs.cache-hit != 'true' && hashFiles('.ci/stx-package/gui-forms-stx-package.stamp') != ''
        with:
          path: .ci/stx-package
          key: ${{ steps.stx-package.outputs.cache-primary-key }}
      - name: Report cache statistics
        if: steps.promotion.outputs.reused != 'true' && (always())
        run: ccache --show-stats --verbose
      # The saved cache, and the consumer archive below, hold this build's
      # working set, not every generation up to CCACHE_MAXSIZE
      # (notes:planning/BUILD_SIZE_PLAN_2026-10-23.md, step 1). On every event: a
      # native job builds everything (no change selection), so the set is
      # complete, and the archive the programs job, a stacked pull request's
      # seed and a consumer download is about 25 MB instead of 600. Only after
      # a build that passed, or on a pull request after its build step ran at
      # all (the pull request's own save below); a job that reused a validation
      # compiled nothing and keeps its cache.
      - name: Keep only the compiler cache entries this build used
        if: steps.promotion.outputs.reused != 'true' && steps.reuse.outputs.reused != 'true' && (success() || (!cancelled() && github.event_name == 'pull_request' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')))
        run: python template_harness/harness/ci_cache.py evict --since "$GUI_FORMS_JOB_START"
      # A pull request keeps its own objects, after a failed build or test too
      # (owner, 2026-11-16: the check efficiency audit's fix 2): its next push
      # restores them before main's, instead of starting again from main's
      # objects, which a checkpoint's header changes make miss (2 to 13 % hits
      # on #483). They are their own family (...-pr<number>-), scoped by GitHub
      # to the pull request's ref, so no restore on main or in another pull
      # request sees them, and native.yml's cache-prune-pull-request deletes the
      # generations each save supersedes.
      - uses: actions/cache/save@v4
        if: steps.promotion.outputs.reused != 'true' && steps.reuse.outputs.reused != 'true' && inputs.cold_build != true && !cancelled() && github.event_name == 'pull_request' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        with:
          path: .ccache
          key: gui-objects-v2-${{ inputs.platform }}-${{ steps.compiler.outputs.identity }}-pr${{ github.event.pull_request.number }}-${{ steps.inputs.outputs.tree }}
      # Only main saves object caches into main's family: merge groups seed
      # from validated archives (ci_promote.py seed), and a pull request saves
      # into its own family above.
      # Only after the build and its tests passed (owner, 2026-11-01): a
      # failed build's cache, unevicted, would become the family's newest
      # entry, which every restore picks and ci_cache prune keeps while it
      # deletes the last good one.
      - uses: actions/cache/save@v4
        if: steps.promotion.outputs.reused != 'true' && github.event_name != 'pull_request' && github.event_name != 'merge_group' && (success() && (steps.reuse.outputs.reused == 'true' || (steps.objects.outputs.cache-primary-key != '' && steps.objects.outputs.cache-hit != 'true')))
        with:
          path: .ccache
          key: gui-objects-v2-${{ inputs.platform }}-${{ steps.compiler.outputs.identity }}-${{ steps.inputs.outputs.tree }}
      - name: Archive consumer cache seed
        if: steps.promotion.outputs.reused != 'true'
        run: |
          python template_harness/harness/cache_manifest.py "${{ inputs.platform }}" "${{ steps.compiler.outputs.identity }}"
          if [ "$RUNNER_OS" = macOS ]; then
            tar -czf gui-forms-cache-${{ inputs.platform }}.tar.gz .ccache cache-manifest.json .build/toolchain/llvm-22.1.8-macos14
          else
            tar -czf gui-forms-cache-${{ inputs.platform }}.tar.gz .ccache cache-manifest.json
          fi
      - name: Prove archived macOS runtimes after relocation
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'macOS' && steps.reuse.outputs.reused != 'true')
        run: python gui_forms/tools/prove_macos_runtime_restore.py --archive gui-forms-cache-macos-arm64.tar.gz --executable .build/native-macos-arm64/gui-forms/gui_forms_form_compiler
      - uses: actions/upload-artifact@v4
        id: cache-artifact
        with:
          name: gui-forms-cache-${{ inputs.platform }}
          overwrite: true
          path: gui-forms-cache-${{ inputs.platform }}.tar.gz
          compression-level: 0
          retention-days: 30
      # A pull request's build covers the suite but not the SDK install, so it
      # records no receipt a merge group or main could reuse as a full
      # validation of the same tree.
      - name: Record successful native validation and cache provenance
        id: receipt
        if: github.event_name != 'pull_request'
        shell: bash
        run: python template_harness/harness/ci_reuse.py record --artifact-id "${{ steps.cache-artifact.outputs.artifact-id }}"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: ${{ steps.receipt.outputs.receipt-name }}
          path: .ci/receipt.json
          include-hidden-files: true
          overwrite: true
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-forms-evidence-${{ inputs.platform }}
          include-hidden-files: true
          overwrite: true
          path: |
            .build/native-${{ inputs.platform }}/installed-reference-examples/Testing/Temporary/LastTest.log
            .build/native-${{ inputs.platform }}/gui-forms/.ninja_log
            .build/native-${{ inputs.platform }}/gui-forms/build-output.log
            .build/native-${{ inputs.platform }}/gui-forms/build-clock.json
            .ci/windows-resources.tsv
            .ci/*.json
      # The test cache (tools/test_cache.py): an artifact of every run, and
      # published per commit (release test-cache-<commit>) on a push to main
      # or to a checkpoint branch, where gui_forms_tests' gui_forms.lock can
      # name it. A run that promoted or reused a validation of the same tree
      # built nothing: it takes that run's test cache, whose manifest names
      # the same tree (test_cache.py publish checks it).
      - uses: actions/upload-artifact@v4
        if: steps.promotion.outputs.reused != 'true' && steps.reuse.outputs.reused != 'true'
        with:
          name: gui-forms-test-cache-${{ inputs.platform }}
          path: .ci/test-cache/gui_forms_test_cache-*
          compression-level: 0
          overwrite: true
          retention-days: 30
      - uses: actions/download-artifact@v4
        if: steps.promotion.outputs.reused == 'true' || steps.reuse.outputs.reused == 'true'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.promotion.outputs.producer-run || steps.reuse.outputs.producer-run }}
          name: gui-forms-test-cache-${{ inputs.platform }}
          path: .ci/test-cache
      - name: Publish the test cache for this commit
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/checkpoint/'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for archive in .ci/test-cache/gui_forms_test_cache-*.tar.gz; do
            python gui_forms/tools/test_cache.py publish --archive "$archive" --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
          done
      - name: Publish this passing platform immediately
        # Only a push to main publishes. The daily schedule rebuilds a commit
        # main already published, and publish_cache.py refuses different bytes.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python template_harness/harness/publish_cache.py --platform "${{ inputs.platform }}"
