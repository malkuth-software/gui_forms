name: GUI.Forms source and compiler cache
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue: each merge group runs every required check, under the
  # same names, on its temporary gh-readonly-queue/main/... branch, whose
  # commit main then becomes. It publishes nothing and saves no Actions cache
  # (its branch's caches reach no other ref); the push to main that follows
  # carries its validation, receipts and deployment tests.
  merge_group:
  # The daily full run on main reuses nothing: every native job validates
  # afresh, and the deployment and docs jobs build and test everything.
  # (The Sanitizers job runs only when requested by hand; see its comment.) It is the backstop for what a push to main carries from the
  # merged pull request's run (tools/release_tests.py, tools/ci_tree_receipt.py):
  # the name match of tools/native_tests.py and the change selection of
  # tools/change_selection.py. It publishes nothing.
  # It runs only when main changed since the last successful scheduled run,
  # and every Sunday regardless (runner images and the Homebrew compiler can
  # change under an unchanged main); house-style decides, and every other
  # job follows its `run` output.
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      force_validation:
        description: Run native validation even if an identical successful receipt exists
        type: boolean
        default: false
      package_windows_toolchain:
        description: Install and package a new Windows toolchain when none is published for the harness's windows_toolchain.json
        type: boolean
        default: false
      cold_build:
        description: Build the native jobs with no compiler cache or object seed, validating afresh, and skip the deployment build (one cold-build measurement)
        type: boolean
        default: false
      run_sanitizers:
        description: Run the whole suite under ASan, UBSan and LSan (the Sanitizers job runs only when requested)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  # The daily schedule has its own group, so it and a push to main never
  # cancel each other. A newer push to a pull request cancels its older run,
  # and a newer push to main cancels the older main run: the newer run
  # validates, publishes and leaves the receipts for the newer tree, so the
  # older one would only hold runners. A closed pull request's run is
  # cancelled by cancel-closed-pull-requests.yml, which joins this group.
  group: gui-forms-${{ github.event_name == 'schedule' && 'daily' || github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  house-style:
    runs-on: ubuntu-24.04
    # false on a scheduled run that has nothing new to check; empty otherwise.
    outputs:
      due: ${{ steps.nightly.outputs.run }}
    defaults:
      run:
        working-directory: gui_forms
    steps:
      - uses: actions/checkout@v4
        with:
          path: gui_forms
      # A scheduled run is skipped when the last successful scheduled run
      # checked this same commit, except on Sundays. A failed lookup runs.
      - name: Decide whether the scheduled run has anything new
        id: nightly
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh tools/ci_nightly_due.sh
      # template_harness beside gui_forms, at the commit gui_forms/harness.lock
      # pins: the shared CI tools and checkers (docs/building/template-harness.md).
      - uses: ./gui_forms/.github/actions/harness-checkout
        id: harness
        if: steps.nightly.outputs.run != 'false'
      - uses: actions/setup-python@v5
        if: steps.nightly.outputs.run != 'false'
        with:
          python-version: '3.14'
      # The pinned harness's own tests (the checkers, the reuse, cache and
      # toolchain tools GUI.Forms moved there, and the FranSushi plugins, about
      # 140 s): template_harness has no CI of its own yet. They give the same
      # result for every GUI.Forms commit with the same harness.lock, so they
      # run once per pinned commit (a receipt keyed on it) and on the daily
      # schedule and a manual run (the check efficiency audit, 3a).
      - uses: actions/cache/restore@v4
        id: harness-receipt
        if: steps.nightly.outputs.run != 'false' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        with:
          path: .ci/harness-tests-passed
          key: gui-harness-tests-v1-${{ steps.harness.outputs.commit }}
      - name: Check the pinned harness
        if: steps.nightly.outputs.run != 'false' && steps.harness-receipt.outputs.cache-hit != 'true'
        run: |
          python3 -B -m unittest discover -s ../template_harness/harness -p "test_*.py"
          mkdir -p ../.ci
          echo "${{ steps.harness.outputs.commit }}" > ../.ci/harness-tests-passed
      - uses: actions/cache/save@v4
        if: steps.nightly.outputs.run != 'false' && steps.harness-receipt.outputs.cache-hit != 'true' && hashFiles('.ci/harness-tests-passed') != ''
        with:
          path: .ci/harness-tests-passed
          key: gui-harness-tests-v1-${{ steps.harness.outputs.commit }}
      # The forwarding shims at the old tool paths, on every run.
      - name: Check the shims that reach the harness
        if: steps.nightly.outputs.run != 'false'
        run: python3 -B -m unittest discover -s tools -p test_harness_shims.py
      - name: Check scanner fixtures and corrected authoring scope
        if: steps.nightly.outputs.run != 'false'
        run: |
          python3 -B -m unittest discover -s tools -p test_readthedocs_build.py
          python3 -B -m unittest discover -s tools -p test_stack_frames.py
          python3 -B -m unittest discover -s tools -p test_workflow_pipelines.py
          python3 -B -m unittest discover -s tools -p test_workflow_cache_saves.py
          python3 -B -m unittest discover -s tools -p test_control_registry.py
          python3 -B -m unittest discover -s tools -p test_verify_install.py
          python3 -B -m unittest discover -s tools -p test_sdk_consumer_link.py
          python3 -B -m unittest discover -s tools -p test_drawing_bridge.py
          python3 -B -m unittest discover -s tools -p test_factory_bundle_sizes.py
          python3 tools/control_registry.py check
          python3 tools/control_registry.py emit-cpp --check
          python3 tools/control_registry.py emit-abi --check
          # Stage C: the C ABI's generated C# interop and C++ wrappers (with the
          # wrappers' 1:1 slot map). The blocking audit against the sealed
          # 1.1 baseline is gui_forms_tests' gui_forms_abi_audit test, with
          # the pinned clang.
          python3 -B tools/abi_bindings.py csharp --check
          python3 -B tools/abi_bindings.py cpp --check
          python3 -B tools/drawing_bridge.py --check
          # The class tables (ABI 1.3): generated outputs and the append-only ledger
          # (the C# hook test is gui_forms_tests', checked there).
          python3 -B tools/abi_class_tables.py --check
          # IC3: every interface-contract declaration with its generated
          # outputs (template_harness's ic_declarations, beside this checkout
          # here; the test cache carries no harness, so gui_forms_tests cannot).
          python3 -B tools/ic_declarations.py check --config tools/ic/project.toml --root .
          python3 tools/control_registry.py emit-forms --check
          python3 -B -m unittest discover -s tools -p test_control_schema.py
          python3 tools/control_schema.py check
          python3 tools/control_schema.py render --check
          # Stage T4: the stock anatomies the default theme's sheets compile against.
          python3 -B tools/stock_anatomies.py --check
          # Every recorded difference from Windows Forms' observable contract.
          python3 -B -m unittest discover -s tools -p test_winforms_divergences.py
          python3 tools/winforms_divergences.py check
          python3 tools/winforms_divergences.py render --check
          # Stage T4: direct drawing in controls may only fall (manifests/paint_census.json).
          python3 -B -m unittest discover -s tools -p test_paint_census.py
          # The C++ and C counter (code-statistics.yml runs it on main).
          python3 -B -m unittest discover -s tools -p test_code_statistics.py
          # The audit findings counter for the high-integrity report.
          python3 -B -m unittest discover -s tools -p test_integrity_counts.py
          # Property families: shared enumerations get their traits once.
          python3 -B -m unittest discover -s tools -p test_property_codemod.py
          python3 -B tools/paint_census.py check
          # The host's sin, cos, tan, atan2 and hypot stay out of src/core, src/controls and src/render
          # (stxlib/math.hpp instead; manifests/host_trig_allowance.json only shrinks).
          python3 -B -m unittest discover -s tools -p test_host_trig_check.py
          python3 -B tools/host_trig_check.py check
          # Platform headers only under src/surface/<platform>/; the rest reaches the
          # system through STXlib (manifests/platform_header_allowance.json, empty, only shrinks).
          python3 -B -m unittest discover -s tools -p test_check_platform_headers.py
          python3 -B tools/check_platform_headers.py check
          # Theme variants stage B: the colour relocation instrument.
          python3 -B -m unittest discover -s tools -p test_relocate_colours.py
          python3 -B -m unittest discover -s tools -p test_generate_library_docs.py
          python3 -B -m unittest discover -s tools -p test_flatten_control_headers.py
          python3 tools/generate_library_docs.py --check
          # The documentation's one table of numbers (docs/conf.py): the README's
          # version, ABI and platform lines from it, its source links and the
          # preview plumbing (tools/capture_previews.py, docs/_ext/gf_preview.py).
          python3 -B -m unittest discover -s tools -p test_docs_numbers.py
          python3 -B -m unittest discover -s tools -p test_capture_previews.py
          python3 -B tools/readme_numbers.py --check
          python3 -B ../template_harness/harness/check_house_style.py include src lab demo examples tools stx_fontpack
          python3 -B -m unittest discover -s tools -p test_ci_build.py
          python3 -B -m unittest discover -s tools -p test_ci_docs_only.py
          python3 -B -m unittest discover -s tools -p test_ninja_phases.py
          python3 -B -m unittest discover -s tools -p test_profile_cache.py
          # The shim: the harness's lifetime rules, then GUI.Forms' member-view
          # rule, the termination rule for statics in src/ (exit-releases-nothing) and the
          # tests' stable-ID literal rule.
          python3 -B -m unittest discover -s tools -p test_check_exit_statics.py
          python3 -B -m unittest discover -s tools -p test_check_stable_id_literals.py
          # The state-agreement candidates (hunt 2026-11-23): report-only, never fails.
          python3 -B -m unittest discover -s tools -p test_check_state_agreement.py
          python3 -B tools/check_state_agreement.py src | tail -n 1
          python3 -B tools/check_lifetime_rules.py include src lab demo examples tools stx_fontpack
          # D15 (decision 6a): the standard-library rules, STXlib's check_std_rules
          # copied at 60dea8f; tools/std_rules_allowance.txt only shrinks.
          python3 -B -m unittest discover -s tools -p test_check_std_rules.py
          python3 -I tools/check_std_rules.py --config tools/std_rules.toml
          # The std:: census of the C++ surface (manifests/std_surface_census.json)
          # is a change report: std types in public signatures are fine (owner,
          # 2026-11-17, restated 2026-11-24; D15 V2 to V6 dropped), so it reports
          # and never blocks.
          python3 -B -m unittest discover -s tools -p test_std_surface_census.py
          python3 -I tools/std_surface_census.py check || echo "std_surface_census: reported, not blocking (a change report)"
          # Every public declaration carries its library's export macro.
          python3 -B tools/export_annotations.py check
          # 1.0 condition 3: every control and member, supported, deferred or excluded.
          python3 -B -m unittest discover -s tools -p test_member_manifest.py
          python3 -B tools/control_registry.py members --check
  # Documentation-only pull requests (owner, 2026-11-09): when every changed
  # path is documentation no test reads (tools/ci_docs_only.py), the four
  # native jobs report success without building (their build job is
  # skipped), the engine gate passes without comparing and no deployment job
  # runs; house-style and docs still check the change. Merge groups, pushes,
  # the schedule and dispatches always build in full, as does any failure to
  # classify. The whole history, so the pull request's merge base is known.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: gui_forms
          fetch-depth: 0
      - uses: ./gui_forms/.github/actions/harness-checkout
      - name: Classify the changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 -B gui_forms/tools/ci_docs_only.py --event "$EVENT" --base "$BASE" >> "$GITHUB_OUTPUT"
  # The site depends only on the tree (docs/requirements.txt pins its
  # toolchain), so a tree an earlier run of this repository built passes
  # without building it again (tools/ci_tree_receipt.py); the job still
  # reports success under its own name. The daily schedule always builds.
  # After house-style only for the scheduled run's decision; a failed
  # house-style skips it, and house-style's own failure is the report.
  docs:
    needs: house-style
    if: needs.house-style.outputs.due != 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: gui_forms
      # template_harness beside gui_forms, at the commit gui_forms/harness.lock
      # pins: the shared CI tools and checkers (docs/building/template-harness.md).
      - uses: ./gui_forms/.github/actions/harness-checkout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The MCP tool reference page renders from manifests/mcp_tools.json
      # (tools/mcp_tool_reference.py); this part needs no build.
      - name: Check the MCP tool reference against its manifest
        working-directory: gui_forms
        run: python3 -B tools/mcp_tool_reference.py --check
      - name: Find an earlier build of this tree's documentation
        id: receipt
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 template_harness/harness/ci_tree_receipt.py lookup --kind docs --job docs
      - name: Install the documentation toolchain
        if: steps.receipt.outputs.reused != 'true'
        run: python3 -m pip install -r gui_forms/docs/requirements.txt
      - name: Build the documentation site with warnings as errors
        if: steps.receipt.outputs.reused != 'true'
        working-directory: gui_forms
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v4
        if: steps.receipt.outputs.reused != 'true'
        with:
          name: gui-forms-docs-html
          path: gui_forms/docs/_build/html
          retention-days: 30
      # A job that reused a build records the run it carried.
      - name: Record this tree's documentation build
        id: record
        env:
          CARRIED: ${{ steps.receipt.outputs.producer-run }}
          COVERAGE: ${{ steps.receipt.outputs.coverage }}
        run: python3 template_harness/harness/ci_tree_receipt.py write --kind docs --out .ci/tree-receipt ${CARRIED:+--carried-from "$CARRIED" --coverage "$COVERAGE"}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.record.outputs.artifact }}
          path: .ci/tree-receipt/receipt.json
          retention-days: 30
  # House style section 1: memory errors and undefined behaviour are defects,
  # tests included. The tree builds under AddressSanitizer,
  # UndefinedBehaviorSanitizer and LeakSanitizer into the sanitize test
  # cache; gui_forms_tests runs the whole suite against it, where any report
  # stops its test and fails the job. Owner ruling (2026-11-03): the sanitizers do not run
  # remotely unless someone requests a run by hand (workflow_dispatch with
  # run_sanitizers; one planned at 1.0). Pull requests, pushes, merge groups
  # and the schedule skip this job, and it is not a required check. The gate
  # is the local sanitized run of every test at checkpoint fold time.
  # Like every Linux job it builds with Clang 22 against libc++ 22 and
  # libc++abi (cmake/llvm22.cmake; tools/install_linux_ci_packages.sh
  # installs them).
  sanitizers:
    name: Sanitizers (Linux, ASan + UBSan + LSan)
    needs: house-style
    if: github.event_name == 'workflow_dispatch' && inputs.run_sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    env:
      CC: clang
      CXX: clang++
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      # One tree per job: a pull_request run takes its workflow files from the
      # test merge commit (refs/pull/N/merge), so the job checks out that same
      # commit (the default ref), never the head alone, whose older tree may
      # lack tools main's workflow calls. A push or a merge group checks out
      # its own commit. The whole history, so a pull request's or a merge
      # group's changed paths are taken from its merge base
      # (tools/change_selection.py).
      - uses: actions/checkout@v4
        with:
          path: gui_forms
          fetch-depth: 0
      # template_harness beside gui_forms, at the commit gui_forms/harness.lock
      # pins: the shared CI tools and checkers (docs/building/template-harness.md).
      - uses: ./gui_forms/.github/actions/harness-checkout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # A requested run looks up no earlier receipt and runs the whole suite.
      # The Ubuntu mirror is sometimes slow (7-11 minutes for 30 MB), so the
      # downloaded Ubuntu packages are kept in an Actions cache, refreshed once
      # per runner image; only main saves it (harness/install_linux_ci_packages.sh).
      - name: Name the Linux package cache
        id: linux-image
        run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: linux-packages
        with:
          path: ${{ runner.temp }}/apt-archives
          key: linux-debs-v1-toolkit-${{ runner.arch }}-${{ hashFiles('template_harness/harness/install_linux_ci_packages.sh', 'template_harness/projects/gui_forms.toml') }}-${{ steps.linux-image.outputs.image }}
          restore-keys: linux-debs-v1-toolkit-${{ runner.arch }}-${{ hashFiles('template_harness/harness/install_linux_ci_packages.sh', 'template_harness/projects/gui_forms.toml') }}-
      - name: Install Linux dependencies
        run: sh gui_forms/tools/install_linux_ci_packages.sh toolkit "$RUNNER_TEMP/apt-archives"
      - uses: actions/cache/save@v4
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && steps.linux-packages.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.linux-packages.outputs.cache-primary-key }}
      - name: Configure compiler cache
        run: |
          echo "CCACHE_DIR=$PWD/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$PWD" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          # pch_defines and time_macros served the tests' shared precompiled
          # headers, which went to gui_forms_tests with the tests (its
          # tests.yml keeps the same setting); nothing here compiles a
          # precompiled header or reads __DATE__ or __TIME__. locale keeps
          # LANG and LC_* out of every key: clang translates no message, so
          # the locale changes no output, and a machine whose locale differs
          # from the runner's still hits (the Windows field test, 2026-11-24:
          # LANG alone missed every object). The same in native.yml,
          # native-platform.yml and release.yml, so their caches stay one.
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros,locale" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          # Before the cache is restored: tools/ci_cache.py evict keeps the
          # entries used after this moment.
          echo "GUI_FORMS_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      # Line tables by default; [sanitizer-full-g] in the head commit's message
      # selects -g for a hunt (tools/ci_build.py --debug-info). The checkout is
      # a pull request's merge commit, so the message is read from the head
      # commit by name (the full history holds it); a push reads its own.
      - name: Choose the sanitizer debug information
        id: debug-info
        env:
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mode=lines
          if git -C gui_forms log -1 --format=%B "$HEAD_COMMIT" | grep -qF '[sanitizer-full-g]'; then
            mode=full
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "GUI_FORMS_SANITIZER_DEBUG_INFO=$mode" >> "$GITHUB_ENV"
          echo "Sanitizer debug information: $mode"
      # Pull requests restore main's cache and never save one: a new 600 MB
      # entry per run evicted the dependency and object caches from the
      # repository's 10 GB. Objects of a branch's own earlier push, of the
      # branch a pull request is stacked on, or (on main) of the merged pull
      # request come from the seed artifact below instead. The debug-information
      # mode is in the key, so line-table and full objects never share an entry,
      # and only line-table runs find or pack a seed: a full -g hunt starts from
      # main's cache and leaves no seed behind for a line-table run to restore.
      - uses: actions/cache/restore@v4
        id: sanitizer-cache
        with:
          path: |
            .ccache
          key: gui-sanitize-v1-${{ steps.debug-info.outputs.mode }}-${{ hashFiles('gui_forms/stx.lock') }}-${{ github.sha }}
          restore-keys: |
            gui-sanitize-v1-${{ steps.debug-info.outputs.mode }}-${{ hashFiles('gui_forms/stx.lock') }}-
      - name: Find sanitizer objects of the nearest branch
        id: seed
        if: steps.debug-info.outputs.mode == 'lines'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python template_harness/harness/ci_sanitizer_seed.py find
      - uses: actions/download-artifact@v4
        if: steps.seed.outputs.seeded == 'true'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.seed.outputs.producer-run }}
          artifact-ids: ${{ steps.seed.outputs.artifact-id }}
          path: .ci/sanitizer-seed
          merge-multiple: true
      - name: Replace the restored objects with the seed (every test still runs)
        if: steps.seed.outputs.seeded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python template_harness/harness/ci_sanitizer_seed.py restore --artifact-id "${{ steps.seed.outputs.artifact-id }}"
      - name: Identify and verify LLVM release compiler
        id: compiler
        run: python template_harness/harness/compiler_identity.py
      # Linux links the harness's static position-independent C++ runtime
      # (cmake/llvm22.cmake refuses a configure without it), cached under the
      # native jobs' key.
      - name: Select the Linux runtime prefix
        id: linux-runtime
        run: |
          directory="$(python template_harness/harness/linux_runtime_manifest.py --directory-name)"
          echo "GUI_FORMS_LLVM_RUNTIME=$PWD/.build/toolchain/$directory" >> "$GITHUB_ENV"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .build/toolchain/${{ steps.linux-runtime.outputs.directory }}
          key: gui-linux-runtimes-v1-${{ steps.linux-runtime.outputs.directory }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('template_harness/harness/build_linux_runtimes.py', 'template_harness/harness/linux_runtime_manifest.py', 'template_harness/harness/macos_runtime_manifest.py') }}
      - name: Build the static Linux runtimes
        run: |
          if [ ! -f "$GUI_FORMS_LLVM_RUNTIME/runtime-manifest.json" ]; then
            python template_harness/harness/build_linux_runtimes.py --work "$RUNNER_TEMP/llvm-runtimes" --prefix "$GUI_FORMS_LLVM_RUNTIME" --jobs 4
          fi
          python template_harness/harness/linux_runtime_manifest.py "$GUI_FORMS_LLVM_RUNTIME"
      # The sanitized tree and its test cache (the sanitize kind, which
      # gui_forms_tests' sanitizer run links). Published on a dispatch from
      # main or a checkpoint branch, like the native jobs' caches.
      - name: Build under the sanitizers and pack the test cache
        run: |
          ccache --zero-stats
          python gui_forms/tools/ci_build.py --jobs 4 --sanitize --test-cache .ci/test-cache
      - name: Publish the sanitize test cache for this commit
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/checkpoint/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for archive in .ci/test-cache/gui_forms_test_cache-*.tar.gz; do
            python gui_forms/tools/test_cache.py publish --archive "$archive" --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
          done
      # No first-party function may need a stack frame over 256 KB under the
      # sanitizers: AddressSanitizer's redzones grew test mains to hundreds of KB
      # on Windows, and a chain of them overflowed theme_tests' 1 MB main
      # thread (#283). Reads the prologues of the objects this run built, so
      # a narrowed pull-request build checks the areas it changed. Runs after
      # a failed test too: an overflow fails as a crash, which this names.
      # A run that built nothing (a change no test reads, such as a
      # documentation-only one) passes: ci_build.py's build record says so.
      - name: Check stack frames
        if: ${{ !cancelled() }}
        run: python gui_forms/tools/stack_frames.py check --tree .build/native-linux-x64/gui-forms-sanitize --jobs 4 --top 15
      - name: Report cache statistics
        if: always()
        run: ccache --show-stats --verbose
      # What passed this tree: this run's build record, or the run it carried.
      - name: Record this tree's sanitizer run
        id: record
        if: success()
        run: python template_harness/harness/ci_tree_receipt.py write --kind sanitize --out .ci/tree-receipt --build-record .build/native-linux-x64/gui-forms-sanitize.record.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ steps.record.outputs.artifact }}
          path: .ci/tree-receipt/receipt.json
          retention-days: 30
      - name: Pack the sanitizer objects as the next run's seed
        if: success() && steps.debug-info.outputs.mode == 'lines'
        run: python template_harness/harness/ci_sanitizer_seed.py pack
      - uses: actions/upload-artifact@v4
        if: success() && steps.debug-info.outputs.mode == 'lines'
        with:
          name: gui-sanitize-ccache-linux-x64
          path: |
            gui-sanitize-ccache.tar
            gui-sanitize-ccache.tar.sha256
          compression-level: 0
          retention-days: 7
      # The saved cache is this build's working set, not every generation up
      # to CCACHE_MAXSIZE (notes:planning/BUILD_SIZE_PLAN_2026-10-23.md, step 1). Main
      # saves it when it builds everything: the daily schedule, and a push
      # that carried no pull request's receipt.
      - name: Keep only the compiler cache entries this build used
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python template_harness/harness/ci_cache.py evict --since "$GUI_FORMS_JOB_START"
      - uses: actions/cache/save@v4
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: |
            .ccache
          key: ${{ steps.sanitizer-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sanitizer-test-log
          path: .build/native-linux-x64/gui-forms-sanitize/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  native-macos-arm64:
    name: native (macos-15, macos-arm64, bash)
    needs: [house-style, changes]
    if: needs.house-style.outputs.due != 'false'
    uses: ./.github/workflows/native-platform.yml
    with:
      runner: macos-15
      platform: macos-arm64
      shell: bash
      force_validation: ${{ inputs.force_validation == true || inputs.cold_build == true || github.event_name == 'schedule' }}
      cold_build: ${{ inputs.cold_build == true }}
      package_windows_toolchain: ${{ inputs.package_windows_toolchain == true }}
      docs_only: ${{ needs.changes.outputs.docs_only == 'true' }}
    permissions:
      contents: write
      actions: read

  native-linux-x64:
    name: native (ubuntu-24.04, linux-x64, bash)
    needs: [house-style, changes]
    if: needs.house-style.outputs.due != 'false'
    uses: ./.github/workflows/native-platform.yml
    with:
      runner: ubuntu-24.04
      platform: linux-x64
      shell: bash
      force_validation: ${{ inputs.force_validation == true || inputs.cold_build == true || github.event_name == 'schedule' }}
      cold_build: ${{ inputs.cold_build == true }}
      package_windows_toolchain: ${{ inputs.package_windows_toolchain == true }}
      docs_only: ${{ needs.changes.outputs.docs_only == 'true' }}
    permissions:
      contents: write
      actions: read

  native-linux-arm64:
    name: native (ubuntu-24.04-arm, linux-arm64, bash)
    needs: [house-style, changes]
    if: needs.house-style.outputs.due != 'false'
    uses: ./.github/workflows/native-platform.yml
    with:
      runner: ubuntu-24.04-arm
      platform: linux-arm64
      shell: bash
      force_validation: ${{ inputs.force_validation == true || inputs.cold_build == true || github.event_name == 'schedule' }}
      cold_build: ${{ inputs.cold_build == true }}
      package_windows_toolchain: ${{ inputs.package_windows_toolchain == true }}
      docs_only: ${{ needs.changes.outputs.docs_only == 'true' }}
    permissions:
      contents: write
      actions: read

  native-windows-x64:
    name: native (windows-2022, windows-x64, msys2 {0})
    needs: [house-style, changes]
    if: needs.house-style.outputs.due != 'false'
    uses: ./.github/workflows/native-platform.yml
    with:
      runner: windows-2022
      platform: windows-x64
      shell: 'msys2 {0}'
      force_validation: ${{ inputs.force_validation == true || inputs.cold_build == true || github.event_name == 'schedule' }}
      cold_build: ${{ inputs.cold_build == true }}
      package_windows_toolchain: ${{ inputs.package_windows_toolchain == true }}
      docs_only: ${{ needs.changes.outputs.docs_only == 'true' }}
    permissions:
      contents: write
      actions: read

  # The deployment build (release.yml: the shipped arithmetic, its test cache,
  # the C ABI library and the source SDK), one platform each, built from that
  # platform's native objects as soon as its native job passes. The
  # demonstration programs are malkuth-software/gui_forms_devkit's
  # (devkit-dispatch, below).
  deployment-macos-arm64:
    needs: [changes, native-macos-arm64]
    if: inputs.cold_build != true && needs.changes.outputs.docs_only != 'true'
    uses: ./.github/workflows/release.yml
    with:
      from_native: true
      platform: macos-arm64
    permissions:
      contents: write
      actions: read

  deployment-linux-x64:
    needs: [changes, native-linux-x64]
    if: inputs.cold_build != true && needs.changes.outputs.docs_only != 'true'
    uses: ./.github/workflows/release.yml
    with:
      from_native: true
      platform: linux-x64
    permissions:
      contents: write
      actions: read

  deployment-linux-arm64:
    needs: [changes, native-linux-arm64]
    if: inputs.cold_build != true && needs.changes.outputs.docs_only != 'true'
    uses: ./.github/workflows/release.yml
    with:
      from_native: true
      platform: linux-arm64
    permissions:
      contents: write
      actions: read

  # This job and publish name the results they need instead of relying on an
  # implicit success(), which any skipped job before them turns false.
  deployment-windows-x64:
    needs: [changes, native-windows-x64]
    if: ${{ !cancelled() && needs.native-windows-x64.result == 'success' && inputs.cold_build != true && needs.changes.outputs.docs_only != 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      from_native: true
      platform: windows-x64
    permissions:
      contents: write
      actions: read

  # On main, the tested release, once every platform's deployment build has
  # passed: a release needs all four.
  publish:
    needs: [deployment-macos-arm64, deployment-linux-x64, deployment-linux-arm64, deployment-windows-x64]
    if: >-
      !cancelled()
      && needs.deployment-macos-arm64.result == 'success' && needs.deployment-linux-x64.result == 'success'
      && needs.deployment-linux-arm64.result == 'success' && needs.deployment-windows-x64.result == 'success'
      && needs.deployment-linux-x64.outputs.publish == 'true'
    uses: ./.github/workflows/publish-release.yml
    with:
      tag: ${{ needs.deployment-linux-x64.outputs.tag }}
      version: ${{ needs.deployment-linux-x64.outputs.version }}
    permissions:
      contents: write
      actions: read

  # The lockstep (gui_forms_devkit DEVKIT_DESIGN.md, section 2): on a push to
  # main, once every platform's native job has passed and so published its
  # build-<sha> compiler cache and SDK (native-platform.yml, "Publish this
  # passing platform immediately"), tell malkuth-software/gui_forms_devkit
  # that this revision is green. Its lockstep workflow builds every program
  # and view against exactly this sha. The token is a GitHub App's, installed
  # on the devkit with actions: write only (DEVKIT_DISPATCH_APP_ID and
  # DEVKIT_DISPATCH_APP_KEY); without them the job says so and passes, since
  # gui_forms never waits on the devkit.
  devkit-dispatch:
    needs: [changes, native-macos-arm64, native-linux-x64, native-linux-arm64, native-windows-x64]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.docs_only != 'true'
      && needs.native-macos-arm64.result == 'success' && needs.native-linux-x64.result == 'success'
      && needs.native-linux-arm64.result == 'success' && needs.native-windows-x64.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: CMakeLists.txt
          sparse-checkout-cone-mode: false
      - name: Check for the dispatch app
        id: app
        env:
          APP_ID: ${{ secrets.DEVKIT_DISPATCH_APP_ID }}
          APP_KEY: ${{ secrets.DEVKIT_DISPATCH_APP_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DEVKIT_DISPATCH_APP_ID or DEVKIT_DISPATCH_APP_KEY is not set; gui_forms_devkit is not told about ${GITHUB_SHA}"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        id: token
        if: steps.app.outputs.present == 'true'
        with:
          app-id: ${{ secrets.DEVKIT_DISPATCH_APP_ID }}
          private-key: ${{ secrets.DEVKIT_DISPATCH_APP_KEY }}
          owner: malkuth-software
          repositories: gui_forms_devkit
      - name: Dispatch gui-forms-advanced to gui_forms_devkit
        if: steps.app.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          version="$(sed -n 's/^project(GUIForms VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          test -n "$version"
          gh api repos/malkuth-software/gui_forms_devkit/dispatches --method POST \
            -f event_type=gui-forms-advanced \
            -F "client_payload[sha]=${GITHUB_SHA}" -F "client_payload[version]=${version}"
          echo "gui_forms_devkit told: gui-forms-advanced ${GITHUB_SHA} (${version})"

  # After every job that saves a cache on a push to main: delete the entries
  # each new save superseded, keeping the newest of each family
  # (tools/ci_cache.py prune; notes:planning/BUILD_SIZE_PLAN_2026-10-23.md, step 2).
  # Runs when a saving job failed too, since the others saved. The only job
  # with actions: write.
  # Prunes only after a push whose saving jobs all passed (owner,
  # 2026-11-01). The saves are success-only already, so a failed job adds no
  # entry; skipping the prune as well keeps every family's previous entries
  # until a green push, so no failure can end with fewer good caches.
  cache-prune:
    needs: [native-macos-arm64, native-linux-x64, native-linux-arm64, native-windows-x64, deployment-macos-arm64, deployment-linux-x64, deployment-linux-arm64, deployment-windows-x64]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: gui_forms
      - uses: ./gui_forms/.github/actions/harness-checkout
      - name: Delete superseded cache generations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B template_harness/harness/ci_cache.py prune --ref refs/heads/main --apply

  # A pull request's object caches (native-platform.yml saves one per platform
  # and push, family ...-pr<number>-): delete the generations each new save
  # superseded, keeping the newest of each family on the pull request's ref.
  # Runs after failed jobs too, since those save as well (the check efficiency
  # audit's fix 2). Main's caches are on another ref and never touched here.
  cache-prune-pull-request:
    needs: [native-macos-arm64, native-linux-x64, native-linux-arm64, native-windows-x64]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: gui_forms
      - uses: ./gui_forms/.github/actions/harness-checkout
      - name: Delete superseded cache generations of this pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: python3 -B template_harness/harness/ci_cache.py prune --ref "$REF" --apply
