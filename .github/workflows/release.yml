name: GUI.Forms programs and release
# Builds the demonstration programs (packaging/programs.json) with the Gallery and
# the File Manager demoboard enabled, runs ctest, packages each program, installs
# and smoke-launches the packages on the runner, and publishes a tested `v*`
# release from main. Pull requests stop after the smoke. Toolchain and cache
# restoration mirror native.yml so the published compiler cache can match.
#
# Pushes to main and pull requests run this workflow from native.yml, once per
# platform (platform), after that platform's native job (from_native): the
# programs job then adds the objects the native job just compiled for the same
# tree (the native cache archive), so the toolkit and tests are compiled once
# per platform and run, rather than twice. A push to main also adds the objects
# the programs job of the run that tested its tree created, so main links and
# packages that tree without compiling it again. native.yml then publishes, once all
# four have packaged (publish-release.yml). native.yml's daily scheduled run on
# main calls it the same way and publishes nothing. Tags, manual dispatch and the
# weekly prune still start it directly, with only the Actions caches.
on:
  workflow_call:
    inputs:
      from_native:
        description: Add the calling run's native cache archive to the restored objects
        type: boolean
        default: false
      platform:
        description: Build only this platform's programs, and leave publishing to the caller
        type: string
        default: ''
    outputs:
      version:
        value: ${{ jobs.prepare.outputs.version }}
      tag:
        value: ${{ jobs.prepare.outputs.tag }}
      publish:
        value: ${{ jobs.prepare.outputs.publish }}
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested packages from main
        type: boolean
        default: false
  schedule:
    # Weekly dry report of prunable compiler-cache pre-releases (tools/prune_cache_releases.py).
    - cron: '17 6 * * 1'
permissions:
  contents: read
  actions: read
concurrency:
  # One group per platform when native.yml calls it for each, so the four
  # calls of one run never cancel each other, and one for native.yml's daily
  # schedule, so it and a push to main never cancel each other either.
  group: gui-forms-release-${{ github.event_name == 'schedule' && 'daily-' || '' }}${{ github.head_ref || github.ref_name }}-${{ inputs.platform }}
  # Never on main or a tag: an older main run still publishes (native.yml).
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}
jobs:
  prepare:
    # This workflow's own schedule is the weekly prune; native.yml's daily
    # schedule calls it from_native to build and test every platform.
    if: github.event_name != 'schedule' || inputs.from_native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      matrix: ${{ steps.platforms.outputs.matrix }}
    # gui_forms at gui_forms/ with template_harness beside it: the packaging
    # tools import the harness's (tools/harness_link.py).
    defaults:
      run:
        working-directory: gui_forms
    steps:
      - uses: actions/checkout@v4
        with:
          path: gui_forms
      - uses: ./gui_forms/.github/actions/harness-checkout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the packaging tools
        run: |
          python3 -B -m unittest discover -s tools -p test_publication_version.py
          python3 -B -m unittest discover -s tools -p test_package_programs.py
          python3 -B -m unittest discover -s tools -p test_package_sdk.py
          python3 -B -m unittest discover -s tools -p test_build_sdk.py
          python3 -B -m unittest discover -s ../template_harness/harness -p test_prune_cache_releases.py
          python3 -B -m unittest discover -s tools -p test_release_tests.py
      - name: Select one tested publication version
        id: version
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: python3 tools/publication_version.py
      # Every platform, or only the one native.yml asked for.
      - name: Choose the platforms
        id: platforms
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          platforms = [
              {"runner": "macos-15", "platform": "macos-arm64", "host": "MACOS", "shell": "bash"},
              {"runner": "windows-2022", "platform": "windows-x64", "host": "WINDOWS", "shell": "msys2 {0}"},
              {"runner": "ubuntu-24.04", "platform": "linux-x64", "host": "LINUX", "shell": "bash"},
              {"runner": "ubuntu-24.04-arm", "platform": "linux-arm64", "host": "LINUX", "shell": "bash"},
          ]
          requested = os.environ.get("PLATFORM", "")
          chosen = [entry for entry in platforms if requested in ("", entry["platform"])]
          if not chosen:
              raise SystemExit("unknown platform: " + requested)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps({"include": chosen}) + chr(10))
          EOF
  programs:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      GUI_FORMS_RUNNER: ${{ matrix.runner }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_DIR: .build/native-${{ matrix.platform }}/gui-forms
      OBJCXX: clang++
      CC: clang
      CXX: clang++
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_OBJCXX_COMPILER_LAUNCHER: ccache
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      # The same layout as native.yml (sources at gui_forms/, build three levels
      # down) so the compiler cache native.yml publishes matches these objects.
      # The tree native.yml built and tested and this run's workflow files come
      # from (a pull request's test merge commit, or the pushed commit), so its
      # objects match and packages name that revision.
      - uses: actions/checkout@v4
        with:
          path: gui_forms
          # A pull request's merge commit and its base (HEAD^1), for the change selection.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      # template_harness beside gui_forms, at the commit gui_forms/harness.lock
      # pins; the gui_forms/tools paths below forward to it
      # (docs/building/template-harness.md).
      - uses: ./gui_forms/.github/actions/harness-checkout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # --- toolchain restoration, copied from native.yml ---------------------------
      - uses: actions/setup-python@v5
        id: toolchain-python
        if: runner.os == 'Windows'
        with:
          python-version: '3.14'
          update-environment: false
      - name: Restore the published Windows toolchain without MSYS2 mirrors
        id: toolchain
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN_PYTHON: ${{ steps.toolchain-python.outputs.python-path }}
          # native.yml's dispatch input reaches this called workflow through github.event.
          GUI_FORMS_PACKAGE_WINDOWS_TOOLCHAIN: ${{ github.event.inputs.package_windows_toolchain }}
        run: '"$TOOLCHAIN_PYTHON" gui_forms/tools/windows_toolchain.py restore'
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install cmake ninja ccache llvm@22
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"
      # The Ubuntu mirror is sometimes slow (7-11 minutes for 30 MB), so the
      # downloaded Ubuntu packages are kept in an Actions cache, refreshed once
      # per runner image; only main saves it (tools/install_linux_ci_packages.sh).
      - name: Name the Linux package cache
        id: linux-image
        if: runner.os == 'Linux'
        run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: linux-packages
        if: runner.os == 'Linux'
        with:
          path: ${{ runner.temp }}/apt-archives
          key: linux-debs-v1-programs-${{ runner.arch }}-${{ hashFiles('template_harness/harness/install_linux_ci_packages.sh', 'template_harness/projects/gui_forms.toml') }}-${{ steps.linux-image.outputs.image }}
          restore-keys: linux-debs-v1-programs-${{ runner.arch }}-${{ hashFiles('template_harness/harness/install_linux_ci_packages.sh', 'template_harness/projects/gui_forms.toml') }}-
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sh gui_forms/tools/install_linux_ci_packages.sh programs "$RUNNER_TEMP/apt-archives"
      - uses: actions/cache/save@v4
        if: runner.os == 'Linux' && github.event_name != 'pull_request' && github.event_name != 'merge_group' && steps.linux-packages.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.linux-packages.outputs.cache-primary-key }}
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows' && steps.toolchain.outputs.restored != 'true'
        with:
          msystem: CLANG64
          update: true
          path-type: inherit
          install: ${{ steps.toolchain.outputs.packages }}
      - name: Select macOS 14 runtime prefix
        if: runner.os == 'macOS'
        run: echo "GUI_FORMS_LLVM_RUNTIME=$PWD/.build/toolchain/llvm-22.1.8-macos14" >> "$GITHUB_ENV"
      - name: Identify and verify LLVM release compiler
        id: compiler
        run: python gui_forms/tools/compiler_identity.py
      - uses: actions/cache@v4
        if: runner.os == 'macOS'
        with:
          path: .build/toolchain/llvm-22.1.8-macos14
          key: gui-runtimes-v1-${{ matrix.platform }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('template_harness/harness/build_macos_runtimes.py', 'template_harness/harness/macos_runtime_manifest.py') }}
      - name: Build minimum-compatible macOS runtimes
        if: runner.os == 'macOS'
        run: |
          if [ ! -f "$GUI_FORMS_LLVM_RUNTIME/runtime-manifest.json" ]; then
            python gui_forms/tools/build_macos_runtimes.py --work "$RUNNER_TEMP/llvm-runtimes" --prefix "$GUI_FORMS_LLVM_RUNTIME" --jobs 4
          fi
          python gui_forms/tools/macos_runtime_manifest.py "$GUI_FORMS_LLVM_RUNTIME"
          python gui_forms/tools/audit_macos_minimum.py "$GUI_FORMS_LLVM_RUNTIME/lib"
      - name: Configure compiler cache
        run: |
          cache_dir="$PWD/.ccache"
          cache_base="$PWD"
          if command -v cygpath >/dev/null; then
            cache_dir="$(cygpath -m "$cache_dir")"
            cache_base="$(cygpath -m "$cache_base")"
          fi
          echo "CCACHE_DIR=$cache_dir" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$cache_base" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
          # Before the cache is restored: tools/ci_cache.py evict keeps the
          # entries used after this moment.
          echo "GUI_FORMS_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      # Objects: this workflow's own key first, then whatever native.yml saved for
      # the same compiler. Dependencies: native.yml's exact key (same fetch scripts).
      - uses: actions/cache/restore@v4
        id: objects
        with:
          path: .ccache
          key: gui-programs-objects-v1-${{ matrix.platform }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('gui_forms/CMakeLists.txt', 'gui_forms/cmake/**', 'gui_forms/include/**', 'gui_forms/src/**', 'gui_forms/demo/**', 'gui_forms/file_manager_demoboard/**', 'gui_forms/tests/**') }}
          restore-keys: |
            gui-programs-objects-v1-${{ matrix.platform }}-${{ steps.compiler.outputs.identity }}-
            gui-objects-v2-${{ matrix.platform }}-${{ steps.compiler.outputs.identity }}-
            gui-objects-v2-${{ matrix.platform }}-
      # Restored on every run, saved only on main (below): a pull request's
      # copy could be restored by no other ref.
      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: |
            gui_forms/third_party/miniaudio
          key: gui-deps-v5-${{ runner.os }}-${{ hashFiles('gui_forms/cmake/Audio.cmake') }}
      # Called from native.yml: this run's native job for the platform compiled
      # the toolkit and tests of this very tree and archived its .ccache (or,
      # on a promoted main run, the archive of the run that tested this tree).
      # Its entries are added to the restored cache: ccache entries are
      # content-addressed files, so the union is a valid cache. Its
      # cache-manifest.json names the tests that native job passed on this
      # tree (validated_tests); a pull request runs only the others below.
      - uses: actions/download-artifact@v4
        if: inputs.from_native
        with:
          name: gui-forms-cache-${{ matrix.platform }}
          path: .ci/native-cache
      - name: Add the native job's objects to the compiler cache
        if: inputs.from_native
        run: |
          tar -xzf .ci/native-cache/gui-forms-cache-${{ matrix.platform }}.tar.gz .ccache
          tar -xzf .ci/native-cache/gui-forms-cache-${{ matrix.platform }}.tar.gz -O cache-manifest.json > .ci/native-manifest.json
          rm -rf .ci/native-cache
      # A pull request or a merge group called from native.yml runs only the
      # tests its native job did not pass on this tree: those of the Gallery,
      # the demoboard and any the native job skipped (tools/native_tests.py).
      # A push to main is the commit its merge group tested (or, merged
      # without the queue, has the tree of the up-to-date pull request it
      # merges): main's native job reuses that run's validation, and this job
      # carries that run's programs receipt (the rest of the tests) instead
      # of running them again (owner's choice, 2026-10-23). A release tag names a tree main has already tested and
      # carries main's receipt the same way. Both still package and smoke
      # test under their own version (tools/release_tests.py). With no such
      # run, or one that has not finished, the job runs every test. The daily
      # scheduled run and direct runs always test everything: the schedule is
      # the backstop for native_tests.py's name match.
      - name: Carry the tests of this tree from an earlier run
        id: tested
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.from_native && github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND: ${{ startsWith(github.ref, 'refs/tags/v') && 'find' || 'merged' }}
        run: python gui_forms/tools/release_tests.py "$COMMAND" --platform "${{ matrix.platform }}" --dist dist
      # A push to main carries the run that tested its tree (the merge group, or
      # the merged pull request's run), found before the build: that run's
      # programs job archived the compiler cache entries it created
      # (gui-programs-objects-<platform>, below), which the restored cache
      # lacks because pull requests and merge groups save no Actions cache.
      # Adding them turns this build's compilations into hits, so main links
      # and packages the tested tree without compiling it again (about 200 s
      # of the linux-x64 job on 2026-11-02, run 41473847301). An expired or
      # missing archive only means compiling as before.
      - uses: actions/download-artifact@v4
        id: tested-objects
        if: steps.tested.outputs.reused == 'true' && inputs.from_native && github.event_name == 'push'
        continue-on-error: true
        with:
          name: gui-programs-objects-${{ matrix.platform }}
          path: .ci/tested-objects
          run-id: ${{ steps.tested.outputs.run }}
          github-token: ${{ github.token }}
      - name: Add the tested run's objects to the compiler cache
        if: steps.tested-objects.outcome == 'success'
        run: |
          tar -xf .ci/tested-objects/gui-programs-objects-${{ matrix.platform }}.tar
          rm -rf .ci/tested-objects
      # --- build, as tools/ci_build.py configures it, plus the programs ------------
      # The CPU renderer (stx_skia) and the text stack come from the stx package
      # (cmake/Stx.cmake), restored from the cache the platform's native job
      # keeps under the same key, and built while configuring only when no
      # entry matches.
      - uses: actions/cache/restore@v4
        id: stx-package
        with:
          path: .ci/stx-package
          key: gui-stx-package-v1-${{ matrix.platform }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('gui_forms/stx.lock', 'gui_forms/cmake/Stx.cmake', 'gui_forms/cmake/stx_package/**', 'gui_forms/cmake/freetype/**', 'gui_forms/cmake/llvm22.cmake', 'gui_forms/tools/toolkit_configure.py') }}
      - name: Configure the programs
        run: |
          renderer="-DGUI_FORMS_ENABLE_SKIA=ON"
          miniaudio="$BUILD_DIR/_deps/gui_forms_miniaudio-src"
          if [ -f "$miniaudio/miniaudio.h" ]; then renderer="$renderer -DFETCHCONTENT_SOURCE_DIR_GUI_FORMS_MINIAUDIO=$PWD/$miniaudio"; fi
          cmake -S gui_forms -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/gui_forms/cmake/llvm22.cmake" -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DGUI_FORMS_ENABLE_MACOS_HOST=$([ "${{ matrix.host }}" = MACOS ] && echo ON || echo OFF) \
            -DGUI_FORMS_ENABLE_WINDOWS_HOST=$([ "${{ matrix.host }}" = WINDOWS ] && echo ON || echo OFF) \
            -DGUI_FORMS_ENABLE_LINUX_HOST=$([ "${{ matrix.host }}" = LINUX ] && echo ON || echo OFF) \
            -DGUI_FORMS_ENABLE_HARFBUZZ_TEXT=ON $renderer \
            -DGUI_FORMS_BUILD_TESTS=ON -DGUI_FORMS_BUILD_AUDIO=ON -DGUI_FORMS_AUDIO_VORBIS_BACKEND=stx \
            -DGUI_FORMS_BUILD_GALLERY=ON -DGUI_FORMS_BUILD_FILE_MANAGER_DEMOBOARD=ON \
            -DGUI_FORMS_STX_PACKAGE_DIR="$PWD/.ci/stx-package"
      # A pull request builds only what the tests it runs need: the tests its
      # native job did not pass (tools/native_tests.py select), through
      # tools/test_build_targets.py, and no program, bundle or package no test
      # runs. It packages and launches nothing (below); the merge group and
      # main build, package and launch everything.
      - name: Build the programs and tests
        id: compile
        env:
          PULL_REQUEST: ${{ inputs.from_native && github.event_name == 'pull_request' }}
        run: |
          ccache --zero-stats
          # The entries present before compiling; the archive step below keeps the rest.
          mkdir -p .ccache
          find .ccache -type f | LC_ALL=C sort > "$RUNNER_TEMP/ccache-before.txt"
          if [ "$PULL_REQUEST" != true ]; then
            cmake --build "$BUILD_DIR" --parallel 4
            exit 0
          fi
          selection=$(python gui_forms/tools/native_tests.py select --manifest .ci/native-manifest.json --build-dir "$BUILD_DIR")
          case "$selection" in
            NONE) echo "The native job passed every test of this build; nothing to build"; echo NONE > "$RUNNER_TEMP/pattern.txt"; exit 0 ;;
            ALL) pattern="" ;;
            *) pattern="$selection" ;;
          esac
          # The pull request's merge commit: its first parent is the base.
          python gui_forms/tools/test_build_targets.py --build-dir "$BUILD_DIR" --tests "$pattern" \
            --changed-from HEAD^1 --pattern-out "$RUNNER_TEMP/pattern.txt" > "$RUNNER_TEMP/targets.txt"
          echo "A pull request: building $(wc -l < "$RUNNER_TEMP/targets.txt") outputs the tests run, not every program"
          if [ -s "$RUNNER_TEMP/targets.txt" ]; then
            xargs cmake --build "$BUILD_DIR" --parallel 4 --target < "$RUNNER_TEMP/targets.txt"
          fi
      - name: Report cache statistics
        if: always()
        run: ccache --show-stats --verbose
      - name: Test
        if: steps.tested.outputs.reused != 'true'
        env:
          GUI_FORMS_FONT_DIR: ${{ github.workspace }}/gui_forms/assets/fonts
          NARROW: ${{ inputs.from_native && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
          PULL_REQUEST: ${{ inputs.from_native && github.event_name == 'pull_request' }}
        run: |
          mkdir -p dist
          selection=ALL
          if [ "$PULL_REQUEST" = true ]; then
            # The tests the build step chose: not passed by the native job, and affected by the change.
            selection=$(cat "$RUNNER_TEMP/pattern.txt")
          elif [ "$NARROW" = true ]; then
            selection=$(python gui_forms/tools/native_tests.py select --manifest .ci/native-manifest.json --build-dir "$BUILD_DIR")
          fi
          set -- --test-dir "$BUILD_DIR" --output-on-failure --timeout 120 --output-junit "$PWD/dist/ctest-${{ matrix.platform }}.xml"
          case "$selection" in
            ALL) echo "Running every test" ;;
            NONE) echo "The native job passed every test of this build; nothing left to run"; exit 0 ;;
            *) echo "Running the tests the native job did not pass: $selection"; set -- "$@" -R "$selection" --no-tests=error ;;
          esac
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" ctest "$@"
          else
            ctest "$@"
          fi
      # A pull request or a merge group passes the compiler cache entries its
      # build created to the push to main that merges its tree (above): only
      # the new entries, as the push restores the same Actions cache this run
      # did and the native job's archive. ccache's stats and lock files are
      # left out.
      - name: Archive the objects this build created for main
        if: success() && inputs.from_native && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        run: |
          find .ccache -type f | LC_ALL=C sort > "$RUNNER_TEMP/ccache-after.txt"
          LC_ALL=C comm -13 "$RUNNER_TEMP/ccache-before.txt" "$RUNNER_TEMP/ccache-after.txt" | grep -v -e '/stats$' -e '\.lock$' -e '/tmp/' > "$RUNNER_TEMP/ccache-new.txt" || true
          echo "$(wc -l < "$RUNNER_TEMP/ccache-new.txt") new compiler cache files"
          tar -cf gui-programs-objects-${{ matrix.platform }}.tar -T "$RUNNER_TEMP/ccache-new.txt"
      - uses: actions/upload-artifact@v4
        if: success() && inputs.from_native && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        with:
          name: gui-programs-objects-${{ matrix.platform }}
          path: gui-programs-objects-${{ matrix.platform }}.tar
          compression-level: 0
          retention-days: 7
      # The caches are saved after the build and its tests passed, or the tests
      # were carried from the run that passed them (owner, 2026-11-01): a failed
      # build's cache must never become the newest entry the next run restores.
      # Only main saves (pull requests restore main's): per-PR entries evicted
      # the dependency caches from the repository's 10 GB. The dependencies
      # are saved after the build, which fetched miniaudio's sources.
      # The sources are platform-neutral, so the entry is keyed by the runner's
      # OS only (Linux x64 and arm64 share one; Windows stays apart, as the
      # Actions cache restores no entry across Windows and the others). The
      # miniaudio Git checkout FetchContent made is kept at third_party/miniaudio,
      # the place cmake/Audio.cmake (and the source SDK) read it from.
      - name: Keep the fetched miniaudio sources with the other dependencies
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.dependencies.outputs.cache-hit != 'true'
        run: |
          fetched=".build/native-${{ matrix.platform }}/gui-forms/_deps/gui_forms_miniaudio-src"
          if [ ! -f gui_forms/third_party/miniaudio/miniaudio.h ] && [ -f "$fetched/miniaudio.h" ]; then
            mkdir -p gui_forms/third_party/miniaudio
            tar -C "$fetched" -cf - . | tar -C gui_forms/third_party/miniaudio -xf -
          fi
      - uses: actions/cache/save@v4
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: |
            gui_forms/third_party/miniaudio
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      # The saved cache is this build's working set, not every generation up
      # to CCACHE_MAXSIZE (notes:planning/BUILD_SIZE_PLAN_2026-10-23.md, step 1).
      # The programs build compiles everything, so the set is complete.
      - name: Keep only the compiler cache entries this build used
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.objects.outputs.cache-hit != 'true'
        run: python gui_forms/tools/ci_cache.py evict --since "$GUI_FORMS_JOB_START"
      - uses: actions/cache/save@v4
        if: success() && github.event_name != 'pull_request' && github.event_name != 'merge_group' && steps.objects.outputs.cache-hit != 'true'
        with:
          path: .ccache
          key: ${{ steps.objects.outputs.cache-primary-key }}
      # A package this job built (no native job's entry matched), after the
      # tests passed; merge groups save nothing.
      - uses: actions/cache/save@v4
        if: success() && github.event_name != 'merge_group' && steps.stx-package.outputs.cache-hit != 'true' && hashFiles('.ci/stx-package/gui-forms-stx-package.stamp') != ''
        with:
          path: .ci/stx-package
          key: ${{ steps.stx-package.outputs.cache-primary-key }}
      # --- package, then install and launch what was packaged -----------------------
      - name: Package the programs
        if: ${{ !(inputs.from_native && github.event_name == 'pull_request') }}
        run: |
          extra=""
          if [ "$RUNNER_OS" = macOS ]; then extra="--runtime $GUI_FORMS_LLVM_RUNTIME"; fi
          if [ "$RUNNER_OS" = Windows ]; then extra="--runtime-dir /clang64/bin"; fi
          python gui_forms/tools/package_programs.py --platform "${{ matrix.platform }}" --build-dir "$BUILD_DIR" \
            --version "$RELEASE_VERSION" --out dist --revision "${{ github.sha }}" $extra
      - name: Install and launch the packaged programs
        if: ${{ !(inputs.from_native && github.event_name == 'pull_request') }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" python gui_forms/tools/smoke_package.py --platform "${{ matrix.platform }}" --dist dist --build-dir "$BUILD_DIR" --install
          else
            python gui_forms/tools/smoke_package.py --platform "${{ matrix.platform }}" --dist dist --build-dir "$BUILD_DIR" --install
          fi
      # The source SDK is platform-neutral, so one leg writes it: this tested
      # commit's tree plus the pinned sources the build above configured from.
      # In the push to main that runs the native jobs, each of them has
      # published its platform's build-<sha> compiler cache before the release
      # this SDK joins, so the manifest names that release (--compiler-cache).
      - name: Package the source SDK
        if: matrix.platform == 'linux-x64' && !(inputs.from_native && github.event_name == 'pull_request')
        env:
          COMPILER_CACHE: ${{ inputs.from_native && github.event_name == 'push' && github.ref == 'refs/heads/main' && '--compiler-cache' || '' }}
        run: |
          miniaudio="$BUILD_DIR/_deps/gui_forms_miniaudio-src"
          if [ -f gui_forms/third_party/miniaudio/miniaudio.h ]; then miniaudio=gui_forms/third_party/miniaudio; fi
          python gui_forms/tools/package_sdk.py --version "$RELEASE_VERSION" --revision "${{ github.sha }}" --out dist \
            --checkout "stx=$BUILD_DIR/_deps/gui_forms_stx-src" --checkout "miniaudio=$miniaudio" --fetch-missing $COMPILER_CACHE
      - uses: actions/upload-artifact@v4
        if: ${{ !(inputs.from_native && github.event_name == 'pull_request') }}
        with:
          name: gui-forms-programs-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.pkg
            dist/*.exe
            dist/*.tar.gz
            dist/*.deb
          compression-level: 0
          # Linux legs may package nothing until their program mains exist.
          if-no-files-found: ${{ runner.os == 'Linux' && 'warn' || 'error' }}
      # upload-artifact roots an artifact at the common ancestor of its paths, and
      # the release job reads packages-*.json from the top of the merged receipts.
      # Every receipts path stays under dist/; the ctest log is its own artifact.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-forms-receipts-${{ matrix.platform }}
          path: |
            dist/packages-*.json
            dist/smoke-*.json
            dist/ctest-*.xml
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-forms-ctest-log-${{ matrix.platform }}
          path: .build/native-${{ matrix.platform }}/gui-forms/Testing/Temporary/LastTest.log
          if-no-files-found: warn
  # A call for one platform leaves publishing to its caller, which waits for
  # all four.
  release:
    if: inputs.platform == '' && needs.prepare.outputs.publish == 'true'
    needs: [prepare, programs]
    uses: ./.github/workflows/publish-release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: write
      actions: read
  prune:
    # Dry report only: deleting cache pre-releases stays a manual
    # `python3 tools/prune_cache_releases.py --apply` by a maintainer.
    if: inputs.from_native != true && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: gui_forms
      - uses: ./gui_forms/.github/actions/harness-checkout
      - name: Report prunable compiler-cache pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 template_harness/harness/prune_cache_releases.py --repo "${{ github.repository }}"
