# The stx commit GUI.Forms builds with, in lockstep (owner ruling 2026-11-03,
# decision 3(a)): stx_zlib, stx_png, stx_conv, stx_raster3d (since cp33), stx_rtf2md and stx_vorbis;
# since 2026-11-08 also stx_skia and every third-party source (stx
# third_party/); since cp33 also STXlib, which stx pins in its stxlib.lock
# and installs beside its packages (stxlib::algorithms: stx_conv's SIMD level
# and the controls' row height index), so this is GUI.Forms' only pin for
# both. cmake/Stx.cmake builds this commit once into the stx package
# (<build>/stx-package, or -DGUI_FORMS_STX_PACKAGE_DIR=<dir>), reused while
# its stamp matches, and the build links it; a local checkout replaces the
# commit with -DFETCHCONTENT_SOURCE_DIR_GUI_FORMS_STX=<dir>, and
# -DGUI_FORMS_STX_PREFIX=<dir> links a package built elsewhere.
#
# 075dad4 is stx main after stx PR #7, which installs stxlib::mcp (the
# transport GUI.Forms' --mcp links), on stx PR #6's STXlib 6f6df28
# (checkpoints stx5 and stx6: the final CONV, the FFT speed work,
# stxlib::syntax, sincosd, the threading additions, stx_mcp, and the
# outline-atomics helpers inside the installed libraries) and stx_skia's
# zero-stride installPixels check without the reference build.
#
# 1ad1317 is stx main after stx PR #9 (stx 1.0.0; owner, 2026-11-24: stx and
# STXlib share GUI.Forms' numbering from 1.0): STXlib 1.0.0 (e501fa0: the
# regenerated Windows API headers, float.h and PROPERTYKEY_DEFINED for the
# own-runtime target, the allocation-tag table freed at module end),
# stx_vorbis's AVX2 synthesis chosen by stxlib::simd's level (no compiler-rt
# on x86_64-pc-windows-msvc), and every package at version 1.0.0.
#
# 14d3f76 is stx main after stx PR #10 (stx 1.0.1): STXlib 1.0.1 (dd17aae:
# the Windows API headers cover the whole API of every system DLL STXlib
# ships a .def for, the C library headers declare the CRT's POSIX names, and
# operator new and delete are one archive member each), and every package at
# version 1.0.1.
[stx]
repository = "malkuth-software/stx"
commit = "14d3f7652b92a33b8b94d3aedd5fdfac1a000c30"
