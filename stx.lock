# The stx commit GUI.Forms builds with, in lockstep (owner ruling 2026-11-03,
# decision 3(a)): stx_zlib, stx_png, stx_conv (with stx_auxlib::simd),
# stx_rtf2md and stx_vorbis; since 2026-11-08 also stx_skia and every
# third-party source (stx third_party/). cmake/Stx.cmake builds this commit
# once into the stx package (<build>/stx-package, or
# -DGUI_FORMS_STX_PACKAGE_DIR=<dir>), reused while its stamp matches, and the
# build links it; a local checkout replaces the commit with
# -DFETCHCONTENT_SOURCE_DIR_GUI_FORMS_STX=<dir>, and
# -DGUI_FORMS_STX_PREFIX=<dir> links a package built elsewhere.
[stx]
repository = "malkuth-software/stx"
commit = "1f5c6f54ef474c3abfc2db2aa4331aaf1ba807f6"
