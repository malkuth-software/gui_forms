# The C ABI's gf_themes_table (GF_TABLE_THEMES): its behavioural constraints, stated once
# (IC3; the format is template_harness docs/ic_declarations.md). tools/ic_declarations.py generates
# the header's // ic: lines, the entry checks (src/abi/stable/ic/abi_themes_ic_checks.hpp), the member-manifest
# column, the fuzz blocks and the proof obligations from it. Bootstrapped on 2026-11-22 from the
# header's prose and the implementation's refusals, then reviewed; this file is now the source.

schema = 1
component = "gf_themes_table"
namespace = "gf"
header = "include/gui_forms/c/gf_abi.h"
anchor = "typedef struct gf_themes_table {"
keys = { manifest = "gf_abi::themes", abi = "GF_TABLE_THEMES" }
thread = "ui"

[checks]
path = "src/abi/stable/ic/abi_themes_ic_checks.hpp"
namespace = "gui_forms::abi1::ic_themes"
includes = ["gui_forms/c/gf_abi.h"]
used_in = ["src/abi/stable/tables/abi_themes.cpp"]

[[call]]
name = "load"
declarations = ["gf_status (GF_CALL* load)("]
kind = "static"
thread = "ui"
fails = [
  { failure = "invalid_argument", when = "code: a theme package needs a record of at least the 1.0 size with reserved zero" },
  { failure = "invalid_state", when = "GF_STATUS_INVALID_STATE when a control's inline style does not compile against the new theme: nothing changes then either." },
  { failure = "limit_exceeded", when = "code: a theme package holds at most 256 files" },
]

[[call]]
