  { failure = "unsupported_capability", when = "A type that needs another object (a dock site its workspace or a timer its window, say: create_with), and the types neither slot makes (a binding, which GF_TABLE_BINDINGS makes, and live_surface), give GF_STATUS_UNSUPPORTED_CAPABILITY; an unknown one GF_STATUS_NOT_FOUND." },
]

