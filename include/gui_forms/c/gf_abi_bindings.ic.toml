requires = [
  { holds = "not_null(index)", refuses = "value:GF_STATUS_INVALID_ARGUMENT", check = "add_record_index" },
]
fails = [
  { failure = "invalid_state", when = "code: the source's provider does not insert rows" },
]

[[call]]
