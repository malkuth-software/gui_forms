[[call]]
name = "read_cell"
declarations = ["gf_status (GF_CALL* read_cell)("]
kind = "member"
thread = "ui"
in = ["alive"]
outside = "value:GF_STATUS_DISPOSED"
fails = [
  { failure = "invalid_state", when = "The cell (row, column) of the shown rows, read at generation, as properties.get gives a value; a generation that is no longer the source's gives GF_STATUS_STALE_HANDLE, a row or column past the source's GF_STATUS_NOT_FOUND, and a cell the provider gave no valid answer for GF_STATUS_INVALID_STATE with its error as the failure's message." },
  { failure = "not_found", when = "The cell (row, column) of the shown rows, read at generation, as properties.get gives a value; a generation that is no longer the source's gives GF_STATUS_STALE_HANDLE, a row or column past the source's GF_STATUS_NOT_FOUND, and a cell the provider gave no valid answer for GF_STATUS_INVALID_STATE with its error as the failure's message." },
]
