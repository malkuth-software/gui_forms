# The C ABI's gf_bindings_table (GF_TABLE_BINDINGS): its behavioural constraints, stated once
# (IC3; the format is template_harness docs/ic_declarations.md). tools/ic_declarations.py generates
# the header's // ic: lines, the entry checks (src/abi/stable/ic/abi_bindings_ic_checks.hpp), the member-manifest
# column, the fuzz blocks and the proof obligations from it. Bootstrapped on 2026-11-22 from the
# header's prose and the implementation's refusals, then reviewed; this file is now the source.

schema = 1
component = "gf_bindings_table"
namespace = "gf"
header = "include/gui_forms/c/gf_abi.h"
anchor = "typedef struct gf_bindings_table {"
keys = { manifest = "gf_abi::bindings", abi = "GF_TABLE_BINDINGS" }
thread = "ui"
states = ["alive", "disposing", "disposed"]
initial = "alive"
state_query = { call = "gf_objects_table.state", observes = { alive = "GF_OBJECT_STATE_ALIVE", disposing = "GF_OBJECT_STATE_DISPOSING", disposed = "GF_OBJECT_STATE_DISPOSED" } }
identity = { kind = "generational", stale = "value:GF_STATUS_STALE_HANDLE" }

[checks]
path = "src/abi/stable/ic/abi_bindings_ic_checks.hpp"
namespace = "gui_forms::abi1::ic_bindings"
includes = ["gui_forms/c/gf_abi.h"]
used_in = ["src/abi/stable/tables/abi_bindings.cpp"]

[[call]]
name = "bind"
declarations = ["gf_status (GF_CALL* bind)("]
kind = "static"
thread = "ui"
returns = { type = "gf_object", owns = "caller" }
fails = [
  { failure = "disposed", when = "code: the target has been disposed" },
  { failure = "invalid_argument", when = "A property that is not bindable gives GF_STATUS_INVALID_ARGUMENT." },
]

[[call]]
name = "unbind"
declarations = ["gf_status (GF_CALL* unbind)("]
kind = "member"
thread = "ui"
in = ["alive"]
outside = "value:GF_STATUS_DISPOSED"
fails = [
  { failure = "invalid_state", when = "code: the binding is no longer bound" },
]

[[call]]
name = "read_value"
declarations = ["gf_status (GF_CALL* read_value)("]
kind = "member"
thread = "ui"
in = ["alive"]
outside = "value:GF_STATUS_DISPOSED"
parameters = { updated = "uint32_t*" }
requires = [
  { holds = "not_null(updated)", refuses = "value:GF_STATUS_INVALID_ARGUMENT", check = "read_value_updated" },
]

[[call]]
name = "write_value"
declarations = ["gf_status (GF_CALL* write_value)("]
kind = "member"
thread = "ui"
in = ["alive"]
