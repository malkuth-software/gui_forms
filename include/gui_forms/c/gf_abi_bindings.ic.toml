parameters = { accepted = "uint32_t*" }
requires = [
  { holds = "not_null(accepted)", refuses = "value:GF_STATUS_INVALID_ARGUMENT", check = "set_current_field_accepted" },
]

[[call]]
name = "add_records"
declarations = ["gf_status (GF_CALL* add_records)("]
kind = "member"
thread = "ui"
in = ["alive"]
outside = "value:GF_STATUS_DISPOSED"
parameters = { first = "uint64_t*", records = "gf_binding_record*", count = "uint64_t" }
requires = [
  { holds = "not_null(first) and (not_null(records) or count == 0)", refuses = "value:GF_STATUS_INVALID_ARGUMENT", check = "add_records_records" },
]
fails = [
  { failure = "invalid_argument", when = "code: add_records needs records and a first output" },
  { failure = "invalid_state", when = "code: the source's provider does not insert rows" },
  { failure = "limit_exceeded", when = "More than GF_BINDING_MAXIMUM_RECORDS_PER_CALL records give GF_STATUS_LIMIT_EXCEEDED; count 0 adds nothing and writes first." },
]

[[call]]
name = "set_provider"
declarations = ["gf_status (GF_CALL* set_provider)("]
kind = "member"
thread = "ui"
parameters = { column_count = "uint64_t", callbacks = "gf_binding_provider_callbacks*", provider = "uint64_t*" }
requires = [
  { holds = "not_null(provider)", refuses = "value:GF_STATUS_INVALID_ARGUMENT", check = "set_provider_provider" },
  { holds = "not_null(callbacks) or column_count == 0", refuses = "value:GF_STATUS_INVALID_ARGUMENT", check = "set_provider_columns" },
]
fails = [
  { failure = "invalid_argument", when = "code: provider callbacks or columns their checks refuse" },
  { failure = "wrong_handle_kind", when = "code: the object is not a binding source" },
]

[[call]]
