name = "open_content"
declarations = ["gf_status (GF_CALL* open_content)("]
kind = "member"
thread = "ui"
returns = { type = "gf_content_sink", owns = "caller" }
fails = [
  { failure = "invalid_argument", when = "code: open_content needs an output" },
  { failure = "limit_exceeded", when = "code: GF_CONTENT_MAXIMUM_SINKS sinks are held; release one first" },
  { failure = "wrong_handle_kind", when = "A surface that is not a content_surface gives GF_STATUS_WRONG_HANDLE_KIND." },
]

