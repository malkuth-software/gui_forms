# The C ABI's gf_content_table (GF_TABLE_CONTENT): its behavioural constraints, stated once
# (IC3; the format is template_harness docs/ic_declarations.md). tools/ic_declarations.py generates
# the header's // ic: lines, the entry checks (src/abi/stable/ic/abi_content_ic_checks.hpp), the member-manifest
# column, the fuzz blocks and the proof obligations from it. Bootstrapped on 2026-11-22 from the
# header's prose and the implementation's refusals, then reviewed; this file is now the source.

schema = 1
component = "gf_content_table"
namespace = "gf"
header = "include/gui_forms/c/gf_abi.h"
anchor = "typedef struct gf_content_table {"
keys = { manifest = "gf_abi::content", abi = "GF_TABLE_CONTENT" }
thread = "ui"
states = ["alive", "disposing", "disposed"]
initial = "alive"
state_query = { call = "gf_objects_table.state", observes = { alive = "GF_OBJECT_STATE_ALIVE", disposing = "GF_OBJECT_STATE_DISPOSING", disposed = "GF_OBJECT_STATE_DISPOSED" } }
identity = { kind = "generational", stale = "value:GF_STATUS_STALE_HANDLE" }

[constants]
hosted_input_report_size_1_4 = { value = "16", type = "uint32_t" }
request_size_1_4 = { value = "32", type = "uint32_t" }
statistics_size_1_4 = { value = "80", type = "uint32_t" }

[checks]
path = "src/abi/stable/ic/abi_content_ic_checks.hpp"
namespace = "gui_forms::abi1::ic_content"
includes = ["gui_forms/c/gf_abi.h"]
used_in = ["src/abi/stable/tables/abi_content.cpp"]

