thread = "ui"
in = ["alive"]
outside = "value:GF_STATUS_DISPOSED"
fails = [
  { failure = "invalid_argument", when = "code: an edit record has at least the 1.1 size and reserved zero" },
  { failure = "invalid_state", when = "A refused edit gives GF_STATUS_INVALID_STATE, leaves the layout unchanged and writes the reason into refusal (may be null); an applied one writes GF_DOCK_REFUSAL_NONE." },
  { failure = "not_found", when = "code: no panel of that id is registered" },
]

