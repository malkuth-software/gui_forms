requires = [
  { holds = "not_null(location)", refuses = "value:GF_STATUS_INVALID_ARGUMENT", check = "locate_location" },
  { holds = "location_size >= location_size_1_1", refuses = "value:GF_STATUS_INVALID_ARGUMENT", check = "locate_location_size" },
]
refusal_order = ["locate_location", "locate_location_size", "outside"]
fails = [
  { failure = "not_found", when = "code: no panel of that id is registered" },
]

