# The C ABI's gf_docking_table (GF_TABLE_DOCKING): its behavioural constraints, stated once
# (IC3; the format is template_harness docs/ic_declarations.md). tools/ic_declarations.py generates
# the header's // ic: lines, the entry checks (src/abi/stable/ic/abi_docking_ic_checks.hpp), the member-manifest
# column, the fuzz blocks and the proof obligations from it. Bootstrapped on 2026-11-22 from the
# header's prose and the implementation's refusals, then reviewed; this file is now the source.

schema = 1
component = "gf_docking_table"
namespace = "gf"
header = "include/gui_forms/c/gf_abi.h"
anchor = "typedef struct gf_docking_table {"
keys = { manifest = "gf_abi::docking", abi = "GF_TABLE_DOCKING" }
thread = "ui"
states = ["alive", "disposing", "disposed"]
initial = "alive"
state_query = { call = "gf_objects_table.state", observes = { alive = "GF_OBJECT_STATE_ALIVE", disposing = "GF_OBJECT_STATE_DISPOSING", disposed = "GF_OBJECT_STATE_DISPOSED" } }
identity = { kind = "generational", stale = "value:GF_STATUS_STALE_HANDLE" }

[constants]
frame_memory_size_1_6 = { value = "56", type = "uint32_t" }
location_size_1_1 = { value = "40", type = "uint32_t" }

[checks]
path = "src/abi/stable/ic/abi_docking_ic_checks.hpp"
namespace = "gui_forms::abi1::ic_docking"
includes = ["gui_forms/c/gf_abi.h"]
used_in = ["src/abi/stable/tables/abi_docking.cpp"]

[[call]]
name = "register_panel"
declarations = ["gf_status (GF_CALL* register_panel)("]
kind = "member"
thread = "ui"
in = ["alive"]
outside = "value:GF_STATUS_DISPOSED"
fails = [
  { failure = "invalid_argument", when = "The id is a stable id ('.'-separated segments of lowercase ASCII letters and digits joined by single '-') and must be new: another spelling, or an id registered before, gives GF_STATUS_INVALID_ARGUMENT." },
]

[[call]]
name = "set_panel_content"
declarations = ["gf_status (GF_CALL* set_panel_content)("]
kind = "member"
thread = "ui"
in = ["alive"]
outside = "value:GF_STATUS_DISPOSED"
fails = [
