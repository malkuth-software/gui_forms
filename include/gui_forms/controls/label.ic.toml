# Label's property value rules, stated once (IC3: the property families' requires, moved out of
# the prose of tools/property_families/label.json into clauses; the format is template_harness
# docs/ic_declarations.md). tools/ic_declarations.py generates the header's // ic: lines and the entry
# checks (src/controls/label/label_ic_checks.hpp)
# that prepare_write calls. A refusal failure:invalid_argument is a throw of std::invalid_argument before
# anything changes.

schema = 1
component = "Label"
namespace = "gui_forms"
header = "include/gui_forms/controls/label.hpp"
anchor = "class GUI_FORMS_API Label : public Control, public LabelCapabilities<Label> {"
thread = "ui"

[checks]
path = "src/controls/label/label_ic_checks.hpp"
namespace = "gui_forms::detail::ic::label"
includes = ["gui_forms/controls/label.hpp"]
used_in = ["src/controls/label/label.cpp"]

[[call]]
name = "line_spacing"
id = "line_spacing_write"
declarations = ["void prepare_write(const decltype(line_spacing)&"]
kind = "member"
parameters = { incoming = "double" }
requires = [
  { holds = "finite(incoming) and 4 * incoming >= 3 and incoming <= 3", refuses = "failure:invalid_argument", check = "line_spacing" },
]
