# NumericUpDown's property value rules, stated once (IC3: the property families' requires, moved out of
# the prose of tools/property_families/numeric_up_down.json into clauses; the format is template_harness
# docs/ic_declarations.md). tools/ic_declarations.py generates the header's // ic: lines and the entry checks
# (src/controls/panel/numeric_up_down/numeric_up_down_ic_checks.hpp) that prepare_write calls. A refusal failure:invalid_argument is a throw of
# std::invalid_argument before anything changes. Rules the clause grammar cannot state (UTF-8 text, font
# specifications, enumerations) stay in prepare_write and the family's prose.

schema = 1
component = "NumericUpDown"
namespace = "gui_forms"
header = "include/gui_forms/controls/numeric_up_down.hpp"
anchor = "class GUI_FORMS_API NumericUpDown final : public UpDownBase, public NumericUpDownCapabilities<NumericUpDown> {"
thread = "ui"

[checks]
path = "src/controls/panel/numeric_up_down/numeric_up_down_ic_checks.hpp"
namespace = "gui_forms::detail::ic::numeric_up_down"
includes = ["gui_forms/controls/numeric_up_down.hpp"]
used_in = ["src/controls/panel/numeric_up_down/numeric_up_down.cpp"]

[[call]]
name = "minimum"
id = "minimum_write"
declarations = ["void prepare_write(const decltype(minimum)&"]
kind = "member"
parameters = { incoming = "double" }
requires = [
  { holds = "finite(incoming)", refuses = "failure:invalid_argument", check = "minimum" },
]

[[call]]
name = "maximum"
id = "maximum_write"
declarations = ["void prepare_write(const decltype(maximum)&"]
kind = "member"
parameters = { incoming = "double" }
requires = [
  { holds = "finite(incoming)", refuses = "failure:invalid_argument", check = "maximum" },
]

[[call]]
name = "increment"
id = "increment_write"
declarations = ["void prepare_write(const decltype(increment)&"]
kind = "member"
parameters = { incoming = "double" }
requires = [
  { holds = "finite(incoming) and incoming > 0", refuses = "failure:invalid_argument", check = "increment" },
]
