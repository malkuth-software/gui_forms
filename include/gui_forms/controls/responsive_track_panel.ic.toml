# ResponsiveTrackPanel's property value rules, stated once (IC3: the property families' requires, moved out of
# the prose of tools/property_families/responsive_track_panel.json into clauses; the format is template_harness
# docs/ic_declarations.md). tools/ic_declarations.py generates the header's // ic: lines and the entry checks
# (src/controls/scrollable_control/container_control/responsive_track_panel/responsive_track_panel_ic_checks.hpp) that prepare_write calls. A refusal failure:invalid_argument is a throw of
# std::invalid_argument before anything changes. Rules the clause grammar cannot state (UTF-8 text, font
# specifications, enumerations) stay in prepare_write and the family's prose.

schema = 1
component = "ResponsiveTrackPanel"
namespace = "gui_forms"
header = "include/gui_forms/controls/responsive_track_panel.hpp"
anchor = "class GUI_FORMS_API ResponsiveTrackPanel final : public ContainerControl,"
thread = "ui"

[checks]
path = "src/controls/scrollable_control/container_control/responsive_track_panel/responsive_track_panel_ic_checks.hpp"
namespace = "gui_forms::detail::ic::responsive_track_panel"
includes = ["gui_forms/controls/responsive_track_panel.hpp"]
used_in = ["src/controls/scrollable_control/container_control/responsive_track_panel/responsive_track_panel.cpp"]

[[call]]
name = "track_gap"
id = "track_gap_write"
declarations = ["void prepare_write(const decltype(track_gap)&"]
kind = "member"
parameters = { incoming = "double" }
requires = [
  { holds = "finite(incoming) and incoming >= 0 and incoming <= 256", refuses = "failure:invalid_argument", check = "track_gap" },
]
