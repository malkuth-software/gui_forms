# ColorValueEditor's property value rules, stated once (IC3: the property families' requires, moved out of
# the prose of tools/property_families/color_value_editor.json into clauses; the format is template_harness
# docs/ic_declarations.md). tools/ic_declarations.py generates the header's // ic: lines and the entry checks
# (src/controls/panel/color_value_editor/color_value_editor_ic_checks.hpp) that prepare_write calls. A refusal failure:invalid_argument is a throw of
# std::invalid_argument before anything changes. Rules the clause grammar cannot state (UTF-8 text, font
# specifications, enumerations) stay in prepare_write and the family's prose.

schema = 1
component = "ColorValueEditor"
namespace = "gui_forms"
header = "include/gui_forms/controls/color_value_editor.hpp"
anchor = "class GUI_FORMS_API ColorValueEditor final : public Panel, public ColorValueEditorCapabilities<ColorValueEditor> {"
thread = "ui"

[checks]
path = "src/controls/panel/color_value_editor/color_value_editor_ic_checks.hpp"
namespace = "gui_forms::detail::ic::color_value_editor"
includes = ["gui_forms/controls/color_value_editor.hpp"]
used_in = ["src/controls/panel/color_value_editor/color_value_editor.cpp"]

[[call]]
name = "swatch_width"
id = "swatch_width_write"
declarations = ["void prepare_write(const decltype(swatch_width)&"]
kind = "member"
parameters = { incoming = "double" }
requires = [
  { holds = "finite(incoming) and incoming >= 12 and incoming <= 96", refuses = "failure:invalid_argument", check = "swatch_width" },
]
