# ProgressRing's property value rules, stated once (IC3: the property families' requires, moved out of
# the prose of tools/property_families/progress_ring.json into clauses; the format is template_harness
# docs/ic_declarations.md). tools/ic_declarations.py generates the header's // ic: lines and the entry checks
# (src/controls/progress_ring/progress_ring_ic_checks.hpp) that prepare_write calls. A refusal failure:invalid_argument is a throw of
# std::invalid_argument before anything changes. Rules the clause grammar cannot state (UTF-8 text, font
# specifications, enumerations) stay in prepare_write and the family's prose.

schema = 1
component = "ProgressRing"
namespace = "gui_forms"
header = "include/gui_forms/controls/progress_ring.hpp"
anchor = "class GUI_FORMS_API ProgressRing final : public Control, public ProgressRingCapabilities<ProgressRing> {"
thread = "ui"

[checks]
path = "src/controls/progress_ring/progress_ring_ic_checks.hpp"
namespace = "gui_forms::detail::ic::progress_ring"
includes = ["gui_forms/controls/progress_ring.hpp"]
used_in = ["src/controls/progress_ring/progress_ring.cpp"]

[[call]]
name = "value"
id = "value_write"
declarations = ["void prepare_write(const decltype(value)&"]
kind = "member"
parameters = { incoming = "double" }
requires = [
  { holds = "finite(incoming)", refuses = "failure:invalid_argument", check = "value" },
]

[[call]]
name = "maximum"
id = "maximum_write"
declarations = ["void prepare_write(const decltype(maximum)&"]
kind = "member"
parameters = { incoming = "double" }
requires = [
  { holds = "finite(incoming) and incoming > 0", refuses = "failure:invalid_argument", check = "maximum" },
]
