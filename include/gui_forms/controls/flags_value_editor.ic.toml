# FlagsValueEditor's property value rules, stated once (IC3: the property families' requires, moved out of
# the prose of tools/property_families/flags_value_editor.json into clauses; the format is template_harness
# docs/ic_declarations.md). tools/ic_declarations.py generates the header's // ic: lines and the entry checks
# (src/controls/panel/flags_value_editor/flags_value_editor_ic_checks.hpp) that prepare_write calls. A refusal failure:invalid_argument is a throw of
# std::invalid_argument before anything changes. Rules the clause grammar cannot state (UTF-8 text, font
# specifications, enumerations) stay in prepare_write and the family's prose.

schema = 1
component = "FlagsValueEditor"
namespace = "gui_forms"
header = "include/gui_forms/controls/flags_value_editor.hpp"
anchor = "class GUI_FORMS_API FlagsValueEditor final : public Panel, public FlagsValueEditorCapabilities<FlagsValueEditor> {"
thread = "ui"

[checks]
path = "src/controls/panel/flags_value_editor/flags_value_editor_ic_checks.hpp"
namespace = "gui_forms::detail::ic::flags_value_editor"
includes = ["gui_forms/controls/flags_value_editor.hpp"]
used_in = ["src/controls/panel/flags_value_editor/flags_value_editor.cpp"]

[[call]]
name = "overlay_width"
id = "overlay_width_write"
declarations = ["void prepare_write(const decltype(overlay_width)&"]
kind = "member"
parameters = { incoming = "double" }
requires = [
  { holds = "finite(incoming) and incoming >= 80 and incoming <= 1024", refuses = "failure:invalid_argument", check = "overlay_width" },
]
