# ButtonBase's property value rules, stated once (IC3: the property families' requires, moved out of
# the prose of tools/property_families/button_base.json into clauses; the format is template_harness
# docs/ic_declarations.md). tools/ic_declarations.py generates the header's // ic: lines and the entry checks
# (src/controls/button_base/button_base_ic_checks.hpp) that prepare_write calls. A refusal failure:invalid_argument is a throw of
# std::invalid_argument before anything changes. Rules the clause grammar cannot state (UTF-8 text, font
# specifications, enumerations) stay in prepare_write and the family's prose.

schema = 1
component = "ButtonBase"
namespace = "gui_forms"
header = "include/gui_forms/controls/button_base.hpp"
anchor = "class GUI_FORMS_API ButtonBase : public Control, public ButtonBaseCapabilities<ButtonBase> {"
thread = "ui"

[checks]
path = "src/controls/button_base/button_base_ic_checks.hpp"
namespace = "gui_forms::detail::ic::button_base"
includes = ["gui_forms/controls/button_base.hpp"]
used_in = ["src/controls/button_base/button_base.cpp"]

[[call]]
name = "image_gap"
id = "image_gap_write"
declarations = ["void prepare_write(const decltype(image_gap)&"]
kind = "member"
parameters = { incoming = "double" }
requires = [
  { holds = "finite(incoming) and incoming >= 0 and incoming <= 64", refuses = "failure:invalid_argument", check = "image_gap" },
]

[[call]]
name = "text_line_spacing"
id = "text_line_spacing_write"
declarations = ["void prepare_write(const decltype(text_line_spacing)&"]
kind = "member"
parameters = { incoming = "double" }
requires = [
  { holds = "finite(incoming) and 4 * incoming >= 3 and incoming <= 3", refuses = "failure:invalid_argument", check = "text_line_spacing" },
]
