# ToolStrip's property value rules, stated once (IC3: the property families' requires, moved out of
# the prose of tools/property_families/tool_strip.json into clauses; the format is template_harness
# docs/ic_declarations.md). tools/ic_declarations.py generates the header's // ic: lines and the entry
# checks (src/controls/tool_strip/tool_strip_ic_checks.hpp)
# that prepare_write calls. A refusal failure:invalid_argument is a throw of std::invalid_argument before
# anything changes.

schema = 1
component = "ToolStrip"
namespace = "gui_forms"
header = "include/gui_forms/controls/tool_strip.hpp"
anchor = "class GUI_FORMS_API ToolStrip : public Control, public ToolStripCapabilities<ToolStrip> {"
thread = "ui"

[checks]
path = "src/controls/tool_strip/tool_strip_ic_checks.hpp"
namespace = "gui_forms::detail::ic::tool_strip"
includes = ["gui_forms/controls/tool_strip.hpp"]
used_in = ["src/controls/tool_strip/tool_strip.cpp"]

[[call]]
name = "end_reserve"
id = "end_reserve_write"
declarations = ["void prepare_write(const decltype(end_reserve)&"]
kind = "member"
parameters = { incoming = "double" }
requires = [
  { holds = "finite(incoming) and incoming >= 0 and incoming <= 64", refuses = "failure:invalid_argument", check = "end_reserve" },
]
