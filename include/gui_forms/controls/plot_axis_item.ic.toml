# PlotAxisItem's property value rules, stated once (IC3: the property families' requires, moved out of
# the prose of tools/property_families/plot_axis_item.json into clauses; the format is template_harness
# docs/ic_declarations.md). tools/ic_declarations.py generates the header's // ic: lines and the entry checks
# (src/controls/plots/plot_axis_item/plot_axis_item_ic_checks.hpp) that prepare_write calls. A refusal failure:invalid_argument is a throw of
# std::invalid_argument before anything changes. Rules the clause grammar cannot state (UTF-8 text, font
# specifications, enumerations) stay in prepare_write and the family's prose.

schema = 1
component = "PlotAxisItem"
namespace = "gui_forms"
header = "include/gui_forms/controls/plot_axis_item.hpp"
anchor = "class GUI_FORMS_API PlotAxisItem final : public Control, public PlotAxisItemCapabilities<PlotAxisItem> {"
thread = "ui"

[checks]
path = "src/controls/plots/plot_axis_item/plot_axis_item_ic_checks.hpp"
namespace = "gui_forms::detail::ic::plot_axis_item"
includes = ["gui_forms/controls/plot_axis_item.hpp"]
used_in = ["src/controls/plots/plot_axis_item/plot_axis_item.cpp"]

[[call]]
name = "follow_span"
id = "follow_span_write"
declarations = ["void prepare_write(const decltype(follow_span)&"]
kind = "member"
parameters = { incoming = "double" }
requires = [
  { holds = "finite(incoming) and incoming >= 0", refuses = "failure:invalid_argument", check = "follow_span" },
]
