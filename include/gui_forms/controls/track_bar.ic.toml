# TrackBar's property value rules, stated once (IC3: the property families' requires, moved out of
# the prose of tools/property_families/track_bar.json into clauses; the format is template_harness
# docs/ic_declarations.md). tools/ic_declarations.py generates the header's // ic: lines and the entry checks
# (src/controls/range_control/track_bar/track_bar_ic_checks.hpp) that prepare_write calls. A refusal failure:invalid_argument is a throw of
# std::invalid_argument before anything changes. Rules the clause grammar cannot state (UTF-8 text, font
# specifications, enumerations) stay in prepare_write and the family's prose.

schema = 1
component = "TrackBar"
namespace = "gui_forms"
header = "include/gui_forms/controls/track_bar.hpp"
anchor = "class GUI_FORMS_API TrackBar : public RangeControl, public TrackBarCapabilities<TrackBar> {"
thread = "ui"

[checks]
path = "src/controls/range_control/track_bar/track_bar_ic_checks.hpp"
namespace = "gui_forms::detail::ic::track_bar"
includes = ["gui_forms/controls/track_bar.hpp"]
used_in = ["src/controls/range_control/track_bar/track_bar.cpp"]

[[call]]
name = "tick_frequency"
id = "tick_frequency_write"
declarations = ["void prepare_write(const decltype(tick_frequency)&"]
kind = "member"
parameters = { incoming = "double" }
requires = [
  { holds = "finite(incoming) and incoming > 0", refuses = "failure:invalid_argument", check = "tick_frequency" },
]

[[call]]
name = "thumb_extent"
id = "thumb_extent_write"
declarations = ["void prepare_write(const decltype(thumb_extent)&"]
kind = "member"
parameters = { incoming = "double" }
requires = [
  { holds = "finite(incoming) and incoming >= 0 and incoming <= 64", refuses = "failure:invalid_argument", check = "thumb_extent" },
]
