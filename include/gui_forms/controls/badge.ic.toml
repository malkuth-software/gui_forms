# Badge's property value rules, stated once (IC3: the property families' requires, moved out of
# the prose of tools/property_families/badge.json into clauses; the format is template_harness
# docs/ic_declarations.md). tools/ic_declarations.py generates the header's // ic: lines and the entry checks
# (src/controls/badge/badge_ic_checks.hpp) that prepare_write calls. A refusal failure:invalid_argument is a throw of
# std::invalid_argument before anything changes. Rules the clause grammar cannot state (UTF-8 text, font
# specifications, enumerations) stay in prepare_write and the family's prose.

schema = 1
component = "Badge"
namespace = "gui_forms"
header = "include/gui_forms/controls/badge.hpp"
anchor = "class GUI_FORMS_API Badge final : public Control, public BadgeCapabilities<Badge> {"
thread = "ui"

[checks]
path = "src/controls/badge/badge_ic_checks.hpp"
namespace = "gui_forms::detail::ic::badge"
includes = ["gui_forms/controls/badge.hpp"]
used_in = ["src/controls/badge/badge.cpp"]

[[call]]
name = "maximum"
id = "maximum_write"
declarations = ["void prepare_write(const decltype(maximum)&"]
kind = "member"
parameters = { incoming = "std::uint32_t" }
requires = [
  { holds = "incoming != 0", refuses = "failure:invalid_argument", check = "maximum" },
]
