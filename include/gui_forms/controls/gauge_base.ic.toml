# GaugeBase's property value rules, stated once (IC3: the property families' requires, moved out of
# the prose of tools/property_families/gauge_base.json into clauses; the format is template_harness
# docs/ic_declarations.md). tools/ic_declarations.py generates the header's // ic: lines and the entry checks
# (src/controls/instruments/gauge_base/gauge_base_ic_checks.hpp) that prepare_write calls. A refusal failure:invalid_argument is a throw of
# std::invalid_argument before anything changes. Rules the clause grammar cannot state (UTF-8 text, font
# specifications, enumerations) stay in prepare_write and the family's prose.

schema = 1
component = "GaugeBase"
namespace = "gui_forms"
header = "include/gui_forms/controls/gauge_base.hpp"
anchor = "class GUI_FORMS_API GaugeBase : public RangeControl, public GaugeBaseCapabilities<GaugeBase> {"
thread = "ui"

[checks]
path = "src/controls/instruments/gauge_base/gauge_base_ic_checks.hpp"
namespace = "gui_forms::detail::ic::gauge_base"
includes = ["gui_forms/controls/gauge_base.hpp"]
used_in = ["src/controls/instruments/gauge_base/gauge_base.cpp"]

[[call]]
name = "tick_frequency"
id = "tick_frequency_write"
declarations = ["void prepare_write(const decltype(tick_frequency)&"]
kind = "member"
parameters = { incoming = "double" }
requires = [
  { holds = "finite(incoming) and incoming >= 0", refuses = "failure:invalid_argument", check = "tick_frequency" },
]

[[call]]
name = "decimal_places"
id = "decimal_places_write"
declarations = ["void prepare_write(const decltype(decimal_places)&"]
kind = "member"
parameters = { incoming = "std::uint32_t" }
requires = [
  { holds = "incoming <= 6", refuses = "failure:invalid_argument", check = "decimal_places" },
]
