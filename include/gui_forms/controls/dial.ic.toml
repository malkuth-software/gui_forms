# Dial's property value rules, stated once (IC3: the property families' requires, moved out of
# the prose of tools/property_families/dial.json into clauses; the format is template_harness
# docs/ic_declarations.md). tools/ic_declarations.py generates the header's // ic: lines and the entry checks
# (src/controls/instruments/dial/dial_ic_checks.hpp) that prepare_write calls. A refusal failure:invalid_argument is a throw of
# std::invalid_argument before anything changes. Rules the clause grammar cannot state (UTF-8 text, font
# specifications, enumerations) stay in prepare_write and the family's prose.

schema = 1
component = "Dial"
namespace = "gui_forms"
header = "include/gui_forms/controls/dial.hpp"
anchor = "class GUI_FORMS_API Dial : public RangeControl, public DialCapabilities<Dial> {"
thread = "ui"

[checks]
path = "src/controls/instruments/dial/dial_ic_checks.hpp"
namespace = "gui_forms::detail::ic::dial"
includes = ["gui_forms/controls/dial.hpp"]
used_in = ["src/controls/instruments/dial/dial.cpp"]

[[call]]
name = "tick_frequency"
id = "tick_frequency_write"
declarations = ["void prepare_write(const decltype(tick_frequency)&"]
kind = "member"
parameters = { incoming = "double" }
requires = [
  { holds = "finite(incoming) and incoming >= 0", refuses = "failure:invalid_argument", check = "tick_frequency" },
]
