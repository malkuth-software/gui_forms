# RangeControl's property value rules, stated once (IC3: the property families' requires, moved out of
# the prose of tools/property_families/range_control.json into clauses; the format is template_harness
# docs/ic_declarations.md). tools/ic_declarations.py generates the header's // ic: lines and the entry checks
# (src/controls/range_control/range_control_ic_checks.hpp) that prepare_write calls. A refusal failure:invalid_argument is a throw of
# std::invalid_argument before anything changes. Rules the clause grammar cannot state (UTF-8 text, font
# specifications, enumerations) stay in prepare_write and the family's prose.

schema = 1
component = "RangeControl"
namespace = "gui_forms"
header = "include/gui_forms/controls/range_control.hpp"
anchor = "class GUI_FORMS_API RangeControl : public Control, public RangeControlCapabilities<RangeControl> {"
thread = "ui"

[checks]
path = "src/controls/range_control/range_control_ic_checks.hpp"
namespace = "gui_forms::detail::ic::range_control"
includes = ["gui_forms/controls/range_control.hpp"]
used_in = ["src/controls/range_control/range_control.cpp"]

[[call]]
name = "small_change"
id = "small_change_write"
declarations = ["void prepare_write(const decltype(small_change)&"]
kind = "member"
parameters = { incoming = "double" }
requires = [
  { holds = "finite(incoming) and incoming > 0", refuses = "failure:invalid_argument", check = "small_change" },
]

[[call]]
name = "large_change"
id = "large_change_write"
declarations = ["void prepare_write(const decltype(large_change)&"]
kind = "member"
parameters = { incoming = "double" }
requires = [
  { holds = "finite(incoming) and incoming > 0", refuses = "failure:invalid_argument", check = "large_change" },
]
