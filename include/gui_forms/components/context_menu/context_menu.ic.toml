# ContextMenu's property value rules, stated once (IC3: the property families' requires, moved out of
# the prose of tools/property_families/context_menu.json into clauses; the format is template_harness
# docs/ic_declarations.md). tools/ic_declarations.py generates the header's // ic: lines and the entry checks
# (src/controls/menu/context_menu/context_menu_ic_checks.hpp) that prepare_write calls. A refusal failure:invalid_argument is a throw of
# std::invalid_argument before anything changes. Rules the clause grammar cannot state (UTF-8 text, font
# specifications, enumerations) stay in prepare_write and the family's prose.

schema = 1
component = "ContextMenu"
namespace = "gui_forms"
header = "include/gui_forms/components/context_menu/context_menu.hpp"
anchor = "class GUI_FORMS_API ContextMenu final : public Component, public ContextMenuCapabilities<ContextMenu> {"
thread = "ui"

[checks]
path = "src/controls/menu/context_menu/context_menu_ic_checks.hpp"
namespace = "gui_forms::detail::ic::context_menu"
includes = ["gui_forms/components/context_menu/context_menu.hpp"]
used_in = ["src/controls/menu/context_menu/context_menu.cpp"]

[[call]]
name = "preferred_width"
id = "preferred_width_write"
declarations = ["void prepare_write(const decltype(preferred_width)&"]
kind = "member"
parameters = { incoming = "double" }
requires = [
  { holds = "finite(incoming) and incoming >= 120 and incoming <= 1024", refuses = "failure:invalid_argument", check = "preferred_width" },
]
